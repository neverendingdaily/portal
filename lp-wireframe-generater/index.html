<!DOCTYPE html>
<html lang="ja">
<head>
  <script>if(!sessionStorage.getItem('portal_auth_token')){location.replace('../')}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LP ワイヤーフレーム自動生成ツール</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    /* ─ ベースカラー ─ */
    --bg-root:     #F4F6F9;   /* 全体背景：ごく薄いブルーグレー */
    --bg-surface:  #FFFFFF;   /* カード・パネル：純白 */
    --bg-subtle:   #F8F9FB;   /* 入力欄・インナー */
    --bg-hover:    #F0F3F8;

    /* ─ ボーダー ─ */
    --border:      #E4E9F0;
    --border-focus:#B8C8E8;

    /* ─ テキスト ─ */
    --text-primary:#2C3E50;
    --text-muted:  #6B7A99;
    --text-dim:    #A8B4C8;

    /* ─ アクセント（インディゴ1色） ─ */
    --accent:      #4F6EF7;
    --accent-dark: #3A56E0;
    --accent-light:#EEF1FF;
    --accent-mid:  #C7D0FC;

    /* ─ シャドウ ─ */
    --shadow-sm: 0 1px 3px rgba(30,50,100,0.06), 0 2px 8px rgba(30,50,100,0.04);
    --shadow-md: 0 2px 8px rgba(30,50,100,0.07), 0 8px 24px rgba(30,50,100,0.07);
    --shadow-lg: 0 4px 16px rgba(30,50,100,0.08), 0 20px 48px rgba(30,50,100,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg-root);
    color: var(--text-primary);
    min-height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ══ HEADER ══════════════════════════ */
  .header {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: var(--shadow-sm);
    position: relative; z-index: 10;
  }
  .logo-wrap { display: flex; align-items: center; gap: 11px; }
  .logo-icon {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #4F6EF7, #7C91FF);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 14px;
    box-shadow: 0 2px 8px rgba(79,110,247,0.28);
  }
  .logo-text {
    font-family: 'Inter', sans-serif; font-weight: 700;
    font-size: 16px; color: var(--text-primary); letter-spacing: -0.3px;
  }
  .logo-text em { font-style: normal; color: var(--accent); }
  .header-badge {
    display: flex; align-items: center; gap: 6px;
    background: var(--accent-light); border: 1px solid var(--accent-mid);
    padding: 4px 12px; border-radius: 20px;
    font-size: 11px; font-weight: 600; color: var(--accent);
    font-family: 'Inter', sans-serif; letter-spacing: 0.3px;
  }
  .kbd-hint {
    display: flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--text-dim); font-family: 'Inter', sans-serif;
  }
  .kbd {
    background: var(--bg-subtle); border: 1px solid var(--border);
    border-radius: 5px; padding: 2px 6px; font-size: 10px;
    color: var(--text-muted); box-shadow: 0 1px 0 var(--border);
    font-family: 'Space Mono', monospace;
  }

  /* ══ LAYOUT ══════════════════════════ */
  .main-layout {
    display: grid;
    grid-template-columns: 400px 1fr;
    height: calc(100vh - 56px);
    overflow: hidden;
  }

  /* ══ LEFT PANEL ══════════════════════ */
  .left-panel {
    background: var(--bg-surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 2px 0 10px rgba(30,50,100,0.04);
  }
  .panel-header {
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--border);
  }
  .panel-title {
    font-family: 'Inter', sans-serif; font-weight: 600;
    font-size: 12px; color: var(--text-muted);
    letter-spacing: 0.8px; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  .p-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
  }

  .input-area {
    flex: 1; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
    overflow-y: auto;
  }
  .input-area::-webkit-scrollbar { width: 4px; }
  .input-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Field label */
  .f-label {
    font-family: 'Inter', sans-serif; font-weight: 600;
    font-size: 12px; color: var(--text-muted);
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 7px;
  }
  .f-label i { color: var(--accent); font-size: 10px; }

  /* API key row */
  .api-key-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px;
    box-shadow: var(--shadow-sm);
    transition: border-color .2s, box-shadow .2s;
  }
  .api-key-row:focus-within {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(79,110,247,0.09), var(--shadow-sm);
  }
  .api-key-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text-primary); font-size: 13px;
    font-family: 'Space Mono', monospace;
  }
  .api-key-input::placeholder { color: var(--text-dim); }
  .eye-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-dim); font-size: 13px; padding: 2px;
    transition: color .2s;
  }
  .eye-btn:hover { color: var(--text-muted); }

  /* Textarea */
  .textarea-wrap { flex: 1; position: relative; }
  .main-textarea {
    width: 100%; height: 100%; min-height: 240px;
    background: var(--bg-surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
    color: var(--text-primary); font-size: 13px; line-height: 1.78;
    resize: none; outline: none;
    font-family: 'Noto Sans JP', sans-serif;
    box-shadow: var(--shadow-sm);
    transition: border-color .2s, box-shadow .2s;
  }
  .main-textarea:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(79,110,247,0.09), var(--shadow-sm);
  }
  .main-textarea::placeholder { color: var(--text-dim); }
  .char-count {
    position: absolute; bottom: 10px; right: 14px;
    font-size: 10px; color: var(--text-dim);
    font-family: 'Space Mono', monospace;
  }

  /* Error */
  .error-box {
    background: #FFF5F5; border: 1px solid #FECACA;
    border-radius: 10px; padding: 12px 16px; font-size: 12px;
    color: #C53030; display: flex; gap: 10px; align-items: flex-start;
    box-shadow: var(--shadow-sm);
  }
  .error-box i { flex-shrink: 0; margin-top: 1px; }

  /* Section tags */
  .stags-wrap { display: flex; flex-direction: column; gap: 8px; }
  .stags-lbl {
    font-size: 11px; color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    display: flex; align-items: center; gap: 5px;
  }
  .stags-lbl i { color: #34D399; font-size: 10px; }
  .stags { display: flex; flex-wrap: wrap; gap: 6px; }
  .stag {
    font-size: 11px; padding: 3px 11px; border-radius: 20px;
    font-family: 'Inter', sans-serif; font-weight: 600;
    border: 1px solid;
  }
  .s-hero      { border-color:#FCD34D; color:#92400E; background:#FFFBEB; }
  .s-problem   { border-color:#FCA5A5; color:#991B1B; background:#FEF2F2; }
  .s-solution  { border-color:#6EE7B7; color:#065F46; background:#ECFDF5; }
  .s-benefits  { border-color:#93C5FD; color:#1E40AF; background:#EFF6FF; }
  .s-cta       { border-color:#C4B5FD; color:#5B21B6; background:#F5F3FF; }

  /* Generate button */
  .gen-btn {
    width: 100%; padding: 13px 20px;
    border-radius: 11px; border: none; cursor: pointer;
    font-family: 'Inter', sans-serif; font-weight: 700;
    font-size: 14px; color: #fff;
    background: var(--accent);
    box-shadow: 0 2px 8px rgba(79,110,247,0.28), 0 4px 20px rgba(79,110,247,0.14);
    transition: background .2s, box-shadow .2s, transform .15s;
  }
  .gen-btn:hover {
    background: var(--accent-dark);
    box-shadow: 0 4px 12px rgba(79,110,247,0.38), 0 8px 28px rgba(79,110,247,0.18);
    transform: translateY(-1px);
  }
  .gen-btn:active { transform: translateY(0); }
  .gen-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }

  .spinner {
    display: inline-block; width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
    border-radius: 50%; animation: spin .75s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─ 履歴UI追加分 ─ */
  .hist-section {
    margin-top: 10px; padding-top: 16px; border-top: 1px solid var(--border);
  }
  .hist-card {
    background: var(--bg-surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; cursor: pointer;
    transition: all 0.2s; box-shadow: 0 1px 2px rgba(30,50,100,0.03);
    margin-bottom: 8px;
  }
  .hist-card:hover { border-color: var(--accent); background: var(--accent-light); }
  .hist-title { font-size: 12px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-date { font-size: 10px; color: var(--text-dim); font-family: 'Space Mono', monospace; }


  /* ══ RIGHT PANEL ═════════════════════ */
  .right-panel {
    display: flex; flex-direction: column;
    background: var(--bg-root); overflow: hidden;
  }
  .preview-toolbar {
    background: var(--bg-surface); border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; box-shadow: var(--shadow-sm);
  }
  .toolbar-left { display: flex; align-items: center; gap: 14px; }
  .view-toggle {
    display: flex; background: var(--bg-subtle);
    border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px;
    box-shadow: inset 0 1px 3px rgba(30,50,100,0.05);
  }
  .toggle-btn {
    padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer;
    font-size: 12px; font-weight: 600; font-family: 'Inter', sans-serif;
    transition: all .2s; color: var(--text-muted); background: transparent;
    display: flex; align-items: center; gap: 6px;
  }
  .toggle-btn.active {
    background: var(--bg-surface); color: var(--text-primary);
    box-shadow: var(--shadow-sm);
  }
  .toggle-btn i { font-size: 11px; }
  .view-lbl { font-size: 11px; color: var(--text-dim); font-family: 'Space Mono', monospace; }

  .toolbar-right { display: flex; align-items: center; gap: 10px; }
  .copy-btn {
    display: none; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg-surface);
    cursor: pointer; font-size: 12px; font-weight: 600;
    color: var(--text-muted); font-family: 'Inter', sans-serif;
    box-shadow: var(--shadow-sm); transition: all .2s;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .live-tag {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--text-dim); font-family: 'Inter', sans-serif;
  }
  .live-tag i { color: #34D399; font-size: 8px; }

  /* Preview */
  .preview-scroll {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 36px 28px;
    display: flex; justify-content: center; align-items: flex-start;
    position: relative;
  }
  .preview-scroll::-webkit-scrollbar { width: 5px; }
  .preview-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* LP Frame */
  .lp-frame {
    background: #fff; border-radius: 16px; overflow: hidden;
    box-shadow: var(--shadow-lg), 0 0 0 1px rgba(30,50,100,0.04);
    transition: all .4s cubic-bezier(.4,0,.2,1);
    width: 100%; max-width: 960px; min-height: 400px;
  }
  .lp-frame.mobile { width: 375px; }

  /* ─ LP Output Sections ─ */
  .lp-hero {
    background: #F8F9FA; /* ごく薄いグレーに変更 */
    color: #333333; /* ダークグレーに変更 */
    padding: 72px 48px;
    text-align: center; position: relative; overflow: hidden;
  }
  .lp-frame.mobile .lp-hero { padding: 50px 24px; }
  .lp-hero::before { display: none; } /* ダークモード用の光の演出を削除 */
  
  .hero-badge {
    display: inline-block; padding: 5px 16px; border-radius: 20px;
    border: 1px solid rgba(79,110,247,0.3); /* アクセントカラーの枠線 */
    font-size: 11px;
    margin-bottom: 20px; letter-spacing: 1.5px; color: #4F6EF7; /* アクセントカラーの文字 */
    font-family: 'Space Mono', monospace;
    background: #EEF1FF; /* ごく薄い青背景 */
  }
  .hero-catch {
    font-size: clamp(22px, 3.5vw, 38px); font-weight: 900;
    line-height: 1.3; margin-bottom: 20px; font-family: 'Inter', sans-serif;
    color: #1A202C; /* 濃いダークグレーに変更（グラデーション解除） */
  }
  .lp-frame.mobile .hero-catch { font-size: 22px; }
  .hero-sub {
    font-size: 15px; color: #6B7A99; /* 柔らかいグレーに変更 */
    max-width: 560px; margin: 0 auto 32px; line-height: 1.78;
  }
  .lp-frame.mobile .hero-sub { font-size: 13px; }
  .hero-cta {
    display: inline-block; padding: 15px 46px;
    background: linear-gradient(135deg, #4F6EF7, #7C91FF);
    color: #fff; font-weight: 800; font-size: 15px;
    border-radius: 50px; font-family: 'Inter', sans-serif;
    box-shadow: 0 4px 16px rgba(79,110,247,0.3); /* 影を少し柔らかく調整 */
  }
  .lp-frame.mobile .hero-cta { font-size: 14px; padding: 13px 30px; }
  .hero-hint {
    margin-top: 40px; font-size: 11px; color: #A8B4C8; /* 薄いグレーに変更 */
    font-family: 'Space Mono', monospace; letter-spacing: 1px;
  }

  .lp-problem { background: #FAFBFC; padding: 64px 48px; border-bottom: 1px solid #EDEEF2; }
  .lp-frame.mobile .lp-problem { padding: 48px 22px; }
  .lp-sec-label {
    font-size: 10px; font-family: 'Inter', sans-serif; font-weight: 700;
    letter-spacing: 2px; color: #A0AEC0; text-transform: uppercase; margin-bottom: 10px;
  }
  .lp-sec-title {
    font-family: 'Inter', sans-serif; font-weight: 800;
    font-size: clamp(18px, 2.2vw, 24px); color: #1A202C;
    margin-bottom: 32px; line-height: 1.42;
  }
  .lp-frame.mobile .lp-sec-title { font-size: 20px; }
  .prob-list { display: flex; flex-direction: column; gap: 12px; }
  .prob-item {
    display: flex; align-items: flex-start; gap: 14px;
    background: #fff; border-radius: 12px; padding: 16px 20px;
    border: 1px solid #EDEEF2;
    box-shadow: 0 1px 4px rgba(30,50,100,0.05), 0 4px 12px rgba(30,50,100,0.04);
  }
  .prob-icon {
    width: 34px; height: 34px; border-radius: 8px;
    background: #FFF5F5; border: 1px solid #FED7D7;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; color: #E53E3E; font-size: 13px;
  }
  .prob-text { font-size: 14px; color: #2D3748; line-height: 1.55; padding-top: 7px; }

  .lp-solution {
    background: #FFFFFF; /* 純白に変更 */
    color: #333333;
    padding: 72px 48px; text-align: center;
    border-bottom: 1px solid #EDEEF2; /* 区切り線を追加 */
  }
  .lp-frame.mobile .lp-solution { padding: 50px 22px; }
  .sol-label { color: #4F6EF7; font-weight: 700; font-size: 12px; letter-spacing: 1px; }
  .sol-title {
    font-family: 'Inter', sans-serif; font-weight: 800;
    font-size: clamp(20px, 2.5vw, 28px); color: #1A202C; /* 濃いグレーに変更 */
    margin-bottom: 20px; margin-top: 8px;
  }
  .lp-frame.mobile .sol-title { font-size: 22px; }
  .sol-divider {
    width: 48px; height: 3px; margin: 24px auto;
    background: linear-gradient(90deg, #4F6EF7, #7C91FF); border-radius: 2px;
  }
  .sol-desc {
    font-size: 15px; color: #6B7A99; /* 柔らかいグレーに変更 */
    max-width: 660px; margin: 0 auto; line-height: 1.85;
  }
  .lp-frame.mobile .sol-desc { font-size: 13px; }

  .lp-benefits { background: #fff; padding: 72px 48px; }
  .lp-frame.mobile .lp-benefits { padding: 50px 22px; }
  .ben-title {
    font-family: 'Inter', sans-serif; font-weight: 800;
    font-size: clamp(18px, 2.2vw, 24px); color: #1A202C;
    margin-bottom: 40px; text-align: center;
  }
  .lp-frame.mobile .ben-title { font-size: 20px; margin-bottom: 28px; }
  .ben-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .lp-frame.mobile .ben-grid { grid-template-columns: 1fr; gap: 14px; }
  .ben-card {
    background: #F8FAFF; border-radius: 14px; padding: 28px 22px;
    border: 1px solid #E8EDFF; text-align: center;
    box-shadow: 0 1px 4px rgba(79,110,247,0.06), 0 4px 16px rgba(79,110,247,0.05);
  }
  .ben-num {
    font-family: 'Inter', sans-serif; font-weight: 800; font-size: 34px;
    background: linear-gradient(135deg, #4F6EF7, #7C91FF);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
  }
  .ben-card-title {
    font-family: 'Inter', sans-serif; font-weight: 700;
    font-size: 15px; color: #1A202C; margin-bottom: 10px;
  }
  .ben-card-desc { font-size: 13px; color: #718096; line-height: 1.65; }

  .lp-cta {
    background: #F8F9FA; /* ごく薄いグレーに変更 */
    padding: 80px 48px; text-align: center; position: relative; overflow: hidden;
  }
  .lp-frame.mobile .lp-cta { padding: 56px 24px; }
  .lp-cta::before { display: none; } /* ダークモード用の光の演出を削除 */
  
  .cta-micro {
    font-size: 13px; color: #6B7A99; /* 柔らかいグレーに変更 */
    font-family: 'Inter', sans-serif; margin-bottom: 24px; font-weight: 600;
  }
  .cta-btn-final {
    display: inline-block; padding: 18px 56px;
    background: linear-gradient(135deg, #F6AD55, #ED8936);
    color: #fff; font-weight: 800; font-size: 18px;
    border-radius: 50px; font-family: 'Inter', sans-serif;
    box-shadow: 0 6px 20px rgba(246,173,85,0.3); /* 影を柔らかく */
    position: relative; z-index: 1;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .cta-btn-final:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(246,173,85,0.4);
  }
  .lp-frame.mobile .cta-btn-final { font-size: 15px; padding: 15px 36px; }
  .cta-safety {
    margin-top: 20px; font-size: 11px; color: #A8B4C8; /* 薄いグレーに変更 */
    font-family: 'Inter', sans-serif;
  }

  /* Empty state */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 16px; padding: 48px; text-align: center;
  }
  .empty-icon {
    width: 72px; height: 72px; border-radius: 18px;
    background: var(--bg-surface); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    box-shadow: var(--shadow-md);
  }
  .empty-title {
    font-family: 'Inter', sans-serif; font-weight: 700;
    font-size: 17px; color: var(--text-muted);
  }
  .empty-sub { font-size: 13px; color: var(--text-dim); max-width: 280px; line-height: 1.65; }
  .skel-wrap { display:flex;flex-direction:column;gap:8px;width:100%;max-width:260px;margin-top:8px; }
  .skel { height:10px;background:var(--bg-surface);border-radius:5px;border:1px solid var(--border); }

  /* Loading */
  .loading-overlay {
    position: absolute; inset: 0; z-index: 10;
    background: rgba(244,246,249,0.84);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    backdrop-filter: blur(6px);
  }
  .loading-ring {
    width: 52px; height: 52px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin .9s linear infinite;
  }

<script>
// ===== APIキー保存・復元機能 =====
const saveAkBtn = document.getElementById('save-ak-btn');
const akEl = document.getElementById('apiKey');

window.addEventListener('DOMContentLoaded', function() {
  const savedKey = localStorage.getItem('savedGeminiApiKey');
  if (savedKey) {
    akEl.value = savedKey;
  }
});

if(saveAkBtn) {
  saveAkBtn.addEventListener('click', function() {
    const currentKey = akEl.value.trim();
    if (currentKey) {
      localStorage.setItem('savedGeminiApiKey', currentKey);
      const origText = saveAkBtn.textContent;
      saveAkBtn.textContent = '✓';
      saveAkBtn.style.color = '#059669';
      saveAkBtn.style.borderColor = '#34D399';
      setTimeout(function(){
        saveAkBtn.textContent = origText;
        saveAkBtn.style.color = '';
        saveAkBtn.style.borderColor = 'var(--border)';
      }, 2000);
    } else {
      localStorage.removeItem('savedGeminiApiKey');
      alert('APIキーの保存を解除しました');
    }
  });
}
// ================================

let currentView = 'pc';
let generatedData = null;

function updateChar(el) {
  document.getElementById('charCount').textContent = el.value.length.toLocaleString() + ' 文字';
}
function toggleKey() {
  const i = document.getElementById('apiKey');
  const ic = document.getElementById('eyeIcon');
  i.type = i.type === 'password' ? 'text' : 'password';
  ic.className = i.type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
}
function setView(mode) {
  currentView = mode;
  const f = document.getElementById('lpFrame');
  const pb = document.getElementById('pcBtn');
  const mb = document.getElementById('mobBtn');
  if (mode === 'pc') {
    f.classList.remove('mobile');
    pb.classList.add('active'); mb.classList.remove('active');
    document.getElementById('viewLbl').textContent = '960px';
  } else {
    f.classList.add('mobile');
    mb.classList.add('active'); pb.classList.remove('active');
    document.getElementById('viewLbl').textContent = '375px';
  }
}
function showErr(msg) {
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('errorBox').style.display = 'flex';
  setTimeout(() => document.getElementById('errorBox').style.display = 'none', 8000);
}
function hideErr() { document.getElementById('errorBox').style.display = 'none'; }

function setLoading(on) {
  const btn = document.getElementById('genBtn');
  const scr = document.getElementById('previewScroll');
  const old = document.getElementById('loadOverlay');
  if (old) old.remove();
  if (on) {
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span><span style="margin-left:10px;">Gemini が分析中</span><span class="ldots"></span>`;
    const ov = document.createElement('div');
    ov.className = 'loading-overlay'; ov.id = 'loadOverlay';
    ov.innerHTML = `<div class="loading-ring"></div>
      <div class="loading-lbl">AI が LP を構造化中<span class="ldots"></span></div>
      <div class="loading-sub">gemini-2.5-flash</div>`;
    scr.appendChild(ov);
  } else {
    btn.disabled = false;
    btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles" style="margin-right:8px;"></i>LPワイヤーフレームを生成`;
  }
}

async function generateLP() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const text   = document.getElementById('articleText').value.trim();
  if (!apiKey)             { showErr('Gemini API キーを入力してください。'); return; }
  if (text.length < 30)  { showErr('テキストを入力してください（30文字以上）。'); return; }
  hideErr(); setLoading(true);

  const sys = `あなたは凄腕のダイレクトレスポンスマーケターです。入力されたテキストを、コンバージョン率を最大化するLPのセクションに分割し、以下のJSONスキーマのみで出力してください。見出しやマイクロコピーは魅力的に補足・リライトしてください。出力はJSONのみ。コードブロックなし。余分なテキストなし。
{"hero":{"catchphrase":"キャッチコピー","sub_copy":"サブコピー","cta_text":"ボタンテキスト"},"problem":{"title":"悩みセクションタイトル","points":["悩み1","悩み2","悩み3"]},"solution":{"title":"解決策タイトル","description":"説明文"},"benefits":{"title":"メリットセクションタイトル","items":[{"title":"メリット1","desc":"説明"},{"title":"メリット2","desc":"説明"},{"title":"メリット3","desc":"説明"}]},"cta_bottom":{"microcopy":"マイクロコピー","button_text":"CTAボタンテキスト"}}`;

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
      { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          system_instruction:{parts:[{text:sys}]},
          contents:[{parts:[{text}]}],
          generationConfig:{responseMimeType:'application/json',temperature:0.7}
        })
      }
    );
    if (!res.ok) { const e=await res.json(); throw new Error(e.error?.message||`HTTP ${res.status}`); }
    const result = await res.json();
    const raw = result.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!raw) throw new Error('Gemini からの応答が空です。');
    const data = JSON.parse(raw.replace(/```json|```/g,'').trim());
    generatedData = data;
    renderLP(data);
    document.getElementById('stagWrap').style.display = 'flex';
    document.getElementById('copyBtn').style.display  = 'inline-flex';

    // ▼ 追加：生成成功時にFirebaseへ履歴保存する呼び出し ▼
    if (window.saveLPHistory) {
      window.saveLPHistory(data);
    }
    // ▲ ここまで ▲

  } catch(err) {
    showErr('エラー: ' + err.message);
  } finally {
    setLoading(false);
  }
}

function renderLP(d) {
  const icons = ['fa-triangle-exclamation','fa-face-sad-tear','fa-clock'];
  const nums  = ['01','02','03'];

  const probs = (d.problem?.points||[]).map((p,i)=>`
    <div class="prob-item ai" style="animation-delay:${.05+i*.07}s;opacity:0;">
      <div class="prob-icon"><i class="fa-solid ${icons[i%3]}"></i></div>
      <div class="prob-text">${esc(p)}</div>
    </div>`).join('');

  const bens = (d.benefits?.items||[]).map((b,i)=>`
    <div class="ben-card ai" style="animation-delay:${.10+i*.08}s;opacity:0;">
      <div class="ben-num">${nums[i]||String(i+1).padStart(2,'0')}</div>
      <div class="ben-card-title">${esc(b.title)}</div>
      <div class="ben-card-desc">${esc(b.desc)}</div>
    </div>`).join('');

  document.getElementById('lpFrame').innerHTML = `
    <div class="lp-hero ai">
      <div class="hero-badge">✦ SPECIAL OFFER ✦</div>
      <h1 class="hero-catch">${esc(d.hero?.catchphrase||'')}</h1>
      <p class="hero-sub">${esc(d.hero?.sub_copy||'')}</p>
      <div class="hero-cta">${esc(d.hero?.cta_text||'今すぐチェック')}</div>
      <div class="hero-hint">▼ SCROLL DOWN ▼</div>
    </div>
    <div class="lp-problem ai d1">
      <div class="lp-sec-label">PROBLEM</div>
      <h2 class="lp-sec-title">${esc(d.problem?.title||'')}</h2>
      <div class="prob-list">${probs}</div>
    </div>
    <div class="lp-solution ai d2">
      <div class="lp-sec-label sol-label">SOLUTION</div>
      <h2 class="sol-title">${esc(d.solution?.title||'')}</h2>
      <div class="sol-divider"></div>
      <p class="sol-desc">${esc(d.solution?.description||'')}</p>
    </div>
    <div class="lp-benefits ai d3">
      <h2 class="ben-title">${esc(d.benefits?.title||'3つのメリット')}</h2>
      <div class="ben-grid">${bens}</div>
    </div>
    <div class="lp-cta ai d4">
      <p class="cta-micro">${esc(d.cta_bottom?.microcopy||'')}</p>
      <div class="cta-btn-final">${esc(d.cta_bottom?.button_text||'今すぐ申し込む')}</div>
      <div class="cta-safety"><i class="fa-solid fa-lock" style="margin-right:4px;opacity:.45;"></i>安心・安全・個人情報保護</div>
    </div>`;

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('lpFrame').style.display    = 'block';
  if (currentView==='mobile') document.getElementById('lpFrame').classList.add('mobile');
  document.getElementById('previewScroll').scrollTop  = 0;
}

function copyHTML() {
  if (!generatedData) return;
  navigator.clipboard.writeText(document.getElementById('lpFrame').outerHTML).then(()=>{
    const btn = document.getElementById('copyBtn');
    const orig = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-check"></i>コピーしました';
    btn.style.cssText += 'color:#059669;border-color:#6EE7B7;background:#ECFDF5;';
    setTimeout(()=>{ btn.innerHTML=orig; btn.style.color=''; btn.style.borderColor=''; btn.style.background=''; }, 2200);
  });
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

document.getElementById('apiKey').addEventListener('keydown', e=>{
  if (e.key==='Enter') document.getElementById('articleText').focus();
});
document.getElementById('articleText').addEventListener('keydown', e=>{
  if ((e.ctrlKey||e.metaKey)&&e.key==='Enter') generateLP();
});
</script>

.__xwg_tab{ flex:1; padding:6px 4px; border:none; border-radius:6px; cursor:pointer; font-family:inherit; font-size:.68rem; font-weight:700; background:transparent; color:#8c8278; transition:all .16s; display:flex; flex-direction:column; align-items:center; gap:1px; }
.__xwg_tab .ti{ font-size:.95rem; }
.__xwg_tab:hover:not(.on){ background:#f3efe5; color:#4a4540; }
.__xwg_tab.on{ background:#d95235; color:#fff; border-radius:6px; }
.__xwg_body{ flex:1; overflow-y:auto; padding:10px; }
.__xwg_pane{ display:none; }
.__xwg_pane.on{ display:block; }
.__xwg_card{ background:#fff; border:1px solid #ddd8ce; border-radius:9px; padding:11px 12px; margin-bottom:8px; }
.__xwg_card:last-child{ margin-bottom:0; }
.__xwg_card_title{ font-size:.7rem; font-weight:700; color:#8c8278; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid #f3efe5; }
.__xwg_inp{ width:100%; padding:7px 10px; background:#faf8f2; border:1.5px solid #ddd8ce; border-radius:7px; font-size:.82rem; outline:none; box-sizing:border-box;}
.__xwg_inp:focus{ border-color:#0e7ea4; background:#fff; }
.__xwg_inp.ta{ resize:vertical; min-height:60px; }
.__xwg_sel{ width:100%; padding:6px 10px; background:#faf8f2; border:1.5px solid #ddd8ce; border-radius:7px; font-size:.8rem; outline:none; box-sizing:border-box;}
.__xwg_row{ display:flex; gap:6px; margin-top:5px; }
.__xwg_row .__xwg_inp{ flex:1; margin-top:0; }
.__xwg_row .__xwg_sel{ flex:0 0 100px; }
.__xwg_btn_s{ padding:6px 11px; border:none; border-radius:6px; cursor:pointer; font-weight:700; transition:all .14s; }
.__xwg_btn_co{ background:#d95235; color:#fff; }
.__xwg_btn_am{ background:#c47e10; color:#fff; }
.__xwg_btn_da{ background:#fdf0ec; color:#d95235; border:1.5px solid #f5c4b8; }
.__xwg_full{ width:100%; padding:8px; margin-top:8px; }
.__xwg_hi{ background:#e8f5fa; border:1px solid #b0d8ea; border-radius:7px; padding:8px 10px; margin-bottom:6px; }
.__xwg_hi_url{ font-size:.68rem; color:#0e7ea4; word-break:break-all; margin-bottom:3px; }
.__xwg_hi_title{ font-size:.76rem; color:#2a2620; font-weight:500; margin-bottom:5px; }
.__xwg_hi_meta{ display:flex; justify-content:space-between; align-items:center; }
.__xwg_hi_date{ font-size:.63rem; color:#8c8278; }
.__xwg_hi_btns{ display:flex; gap:3px; }
.__xwg_hbtn{ font-size:.63rem; padding:2px 7px; border:1.5px solid; border-radius:4px; cursor:pointer; font-weight:700; }
.__xwg_hbtn_go{ border-color:#a8dcc4; color:#2a8c5e; background:#e8f7f0; }
.__xwg_hbtn_cp{ border-color:#b0d8ea; color:#0e7ea4; background:#e8f5fa; }
.__xwg_hbtn_dl{ border-color:#f5c4b8; color:#d95235; background:#fdf0ec; }
.__xwg_tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.__xwg_tag{ display:inline-flex; align-items:center; gap:3px; padding:3px 8px; border-radius:14px; font-size:.7rem; cursor:pointer; border:1.5px solid; }
.__xwg_tag .td{ opacity:.45; font-size:.8rem; }
.__xwg_tag.pain   { background:#fdf0ec; border-color:#f5c4b8; color:#d95235; }
.__xwg_tag.benefit{ background:#e8f7f0; border-color:#a8dcc4; color:#2a8c5e; }
.__xwg_tag.custom { background:#e8f5fa; border-color:#b0d8ea; color:#0e7ea4; }
.__xwg_tag.account{ background:#fdf6e3; border-color:#f0d898; color:#c47e10; }
.__xwg_sub{ font-size:.65rem; font-weight:700; color:#8c8278; margin-top:8px; margin-bottom:5px; }
.__xwg_hr{ border:none; border-top:1px solid #ede8db; margin:8px 0; }
.__xwg_mi{ background:#fdf6e3; border:1.5px solid #f0d898; border-radius:7px; padding:9px 10px 9px 14px; margin-bottom:6px; position:relative; }
.__xwg_mi::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:#c47e10; border-radius:4px 0 0 4px; }
.__xwg_mi_ttl{ font-size:.78rem; font-weight:700; margin-bottom:3px; display:flex; justify-content:space-between; }
.__xwg_mi_body{ font-size:.74rem; line-height:1.6; white-space:pre-wrap; word-break:break-all; }
.__xwg_mi_date{ font-size:.62rem; color:#8c8278; margin-top:5px; }
.__xwg_empty{ text-align:center; padding:20px 10px; color:#8c8278; font-size:.76rem; }
.__xwg_empty .ei{ font-size:1.5rem; margin-bottom:5px; }
.__xwg_flash{ animation:__xwg_fl .6s ease; }
@keyframes __xwg_fl{ 40%{ background:#e8f5fa; border-color:#0e7ea4; } }
`;
const style = document.createElement('style');
style.textContent = _css;
document.head.appendChild(style);

/* ── ⑤ DOM構築 ── */
const anchor = document.getElementById('__xwg_anchor');
anchor.innerHTML = `
<button id="__xwg_btn" onclick="__xwgToggle()" title="メモ・ワード・履歴を開く">
  📌<span class="xwg-badge" id="__xwg_hbadge"></span>
</button>
<div id="__xwg_panel">
  <div class="__xwg_head">
    <span class="__xwg_logo">🗂️</span>
    <span class="__xwg_title">メモ・ワード・履歴</span>
    <button class="__xwg_close" onclick="__xwgClose()">✕</button>
  </div>
  <div class="__xwg_tabs">
    <button class="__xwg_tab on" onclick="__xwgTab('h',this)"><span class="ti">🕐</span>履歴</button>
    <button class="__xwg_tab"   onclick="__xwgTab('w',this)"><span class="ti">📌</span>ワード</button>
    <button class="__xwg_tab"   onclick="__xwgTab('m',this)"><span class="ti">📝</span>メモ</button>
  </div>
  <div class="__xwg_body">
    <div class="__xwg_pane on" id="__xwg_ph">
      <div class="__xwg_card">
        <div class="__xwg_card_title">🕐 ページ訪問履歴</div>
        <div id="__xwg_hlist"></div>
      </div>
      <div style="text-align:right;margin-top:4px;">
        <button class="__xwg_btn_s __xwg_btn_da" onclick="__xwgClearHist()">全削除</button>
      </div>
    </div>
    <div class="__xwg_pane" id="__xwg_pw">
      <div class="__xwg_card">
        <div class="__xwg_card_title">＋ ワードを登録</div>
        <input class="__xwg_inp" type="text" id="__xwg_nw" placeholder="ワード・フレーズ">
        <div class="__xwg_row">
          <select class="__xwg_sel" id="__xwg_nc">
            <option value="custom">🏷 カスタム</option>
            <option value="pain">😤 ペイン</option>
            <option value="benefit">✨ ベネフィット</option>
            <option value="account">👤 アカウント</option>
          </select>
          <input class="__xwg_inp" type="text" id="__xwg_nl" placeholder="ラベル名">
        </div>
        <button class="__xwg_btn_s __xwg_btn_co __xwg_full" onclick="__xwgRegWord()">＋ 登録する</button>
      </div>
      <div class="__xwg_card">
        <div class="__xwg_card_title">登録済みワード</div>
        <div id="__xwg_wtags"></div>
      </div>
    </div>
    <div class="__xwg_pane" id="__xwg_pm">
      <div class="__xwg_card">
        <div class="__xwg_card_title">📝 メモを追加</div>
        <input class="__xwg_inp" type="text" id="__xwg_mt" placeholder="タイトル">
        <textarea class="__xwg_inp ta" id="__xwg_mb" placeholder="本文…" style="margin-top:5px;"></textarea>
        <button class="__xwg_btn_s __xwg_btn_am __xwg_full" onclick="__xwgAddMemo()">保存</button>
      </div>
      <div class="__xwg_card">
        <div class="__xwg_card_title">メモ一覧</div>
        <div id="__xwg_mlist"></div>
      </div>
    </div>
  </div>
</div>
`;

/* ── ⑥ UIロジック ── */
let __xwg_open = false;
window.__xwgToggle = () => {
  __xwg_open = !__xwg_open;
  const panel = document.getElementById('__xwg_panel');
  if(__xwg_open){
    panel.classList.add('open'); window.__xwgRenderAll();
  } else {
    panel.classList.remove('open');
  }
};
window.__xwgClose = () => {
  __xwg_open = false; document.getElementById('__xwg_panel').classList.remove('open');
};
window.__xwgTab = (id, btn) => {
  document.querySelectorAll('.__xwg_pane').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.__xwg_tab').forEach(t=>t.classList.remove('on'));
  document.getElementById({h:'__xwg_ph',w:'__xwg_pw',m:'__xwg_pm'}[id]).classList.add('on');
  btn.classList.add('on'); window.__xwgRenderAll();
};
window.__xwgRenderAll = () => {
  if(!__xwg_open) return;
  __xwgRenderHist(); __xwgRenderWords(); __xwgRenderMemos();
};

function __xwgRenderHist(){
  const list = _ld(XWG_KEYS.history, []);
  const el = document.getElementById('__xwg_hlist');
  if(!list.length) return el.innerHTML = '<div class="__xwg_empty"><div class="ei">🕐</div>履歴がありません</div>';
  el.innerHTML = list.map((h,i) => `
    <div class="__xwg_hi">
      <div class="__xwg_hi_title">${_esc(h.title || '(タイトルなし)')}</div>
      <div class="__xwg_hi_url">${_esc(h.url)}</div>
      <div class="__xwg_hi_meta">
        <span class="__xwg_hi_date">${_fmt(h.ts)}</span>
        <div class="__xwg_hi_btns">
          <button class="__xwg_hbtn __xwg_hbtn_go" onclick="window.open('${_ea(h.url)}','_blank')">開く</button>
          <button class="__xwg_hbtn __xwg_hbtn_cp" onclick="__xwgCopy('${_ea(h.url)}',this)">コピー</button>
          <button class="__xwg_hbtn __xwg_hbtn_dl" onclick="__xwgDelHist(${i})">✕</button>
        </div>
      </div>
    </div>`).join('');
}
window.__xwgDelHist = (i) => { const l=_ld(XWG_KEYS.history,[]); l.splice(i,1); _sv(XWG_KEYS.history, l); };
window.__xwgClearHist = () => { if(confirm('全削除しますか？')) _sv(XWG_KEYS.history, []); };

window.__xwgRegWord = () => {
  const word = document.getElementById('__xwg_nw').value.trim();
  const cat  = document.getElementById('__xwg_nc').value;
  const label = document.getElementById('__xwg_nl').value.trim() || word;
  if(!word) return alert('ワードを入力してください。');
  const words = _ld(XWG_KEYS.words, []);
  words.push({id: Date.now(), word, cat, label, ts: Date.now()});
  _sv(XWG_KEYS.words, words);
  document.getElementById('__xwg_nw').value = ''; document.getElementById('__xwg_nl').value = '';
};
window.__xwgDelWord = (id) => _sv(XWG_KEYS.words, _ld(XWG_KEYS.words,[]).filter(w=>w.id!==id));

function __xwgRenderWords(){
  const words = _ld(XWG_KEYS.words, []);
  const el = document.getElementById('__xwg_wtags');
  if(!words.length) return el.innerHTML = '<div class="__xwg_empty"><div class="ei">📌</div>登録がありません</div>';
  const cats = ['pain','benefit','custom','account'];
  const labels = {pain:'😤 ペイン',benefit:'✨ ベネフィット',custom:'🏷 カスタム',account:'👤 アカウント'};
  let html = '';
  cats.forEach(cat => {
    const cw = words.filter(w=>w.cat===cat);
    if(!cw.length) return;
    html += `<div class="__xwg_sub">${labels[cat]}</div><div class="__xwg_tags">` + cw.map(w=>`
      <span class="__xwg_tag ${w.cat}" title="${_esc(w.word)}" onclick="__xwgCopy('${_ea(w.word)}',this)">
        <span class="tl">${_esc(w.label)}</span>
        <span class="td" onclick="event.stopPropagation();__xwgDelWord(${w.id})">✕</span>
      </span>`).join('') + `</div><div class="__xwg_hr"></div>`;
  });
  el.innerHTML = html;
}

window.__xwgAddMemo = () => {
  const title = document.getElementById('__xwg_mt').value.trim();
  const body  = document.getElementById('__xwg_mb').value.trim();
  if(!title && !body) return;
  const memos = _ld(XWG_KEYS.memos, []);
  memos.unshift({id:Date.now(), title:title||'（無題）', body, ts:Date.now()});
  _sv(XWG_KEYS.memos, memos);
  document.getElementById('__xwg_mt').value = ''; document.getElementById('__xwg_mb').value = '';
};
window.__xwgDelMemo = (id) => _sv(XWG_KEYS.memos, _ld(XWG_KEYS.memos,[]).filter(m=>m.id!==id));

function __xwgRenderMemos(){
  const memos = _ld(XWG_KEYS.memos, []);
  const el = document.getElementById('__xwg_mlist');
  if(!memos.length) return el.innerHTML = '<div class="__xwg_empty"><div class="ei">📝</div>メモがありません</div>';
  el.innerHTML = memos.map(m=>`
    <div class="__xwg_mi">
      <div class="__xwg_mi_ttl"><span>${_esc(m.title)}</span>
        <button class="__xwg_hbtn __xwg_hbtn_dl" onclick="__xwgDelMemo(${m.id})">✕</button>
      </div>
      <div class="__xwg_mi_body">${_esc(m.body)}</div>
      <div class="__xwg_mi_date">${_fmt(m.ts)}</div>
    </div>`).join('');
}

window.__xwgCopy = (text, el) => {
  navigator.clipboard.writeText(text).then(()=>{
    if(el){ el.classList.add('__xwg_flash'); setTimeout(()=>el.classList.remove('__xwg_flash'),700); }
  });
};

function __xwgUpdateBadge(){
  const n = _ld(XWG_KEYS.history, []).length;
  const b = document.getElementById('__xwg_hbadge');
  if(n > 0){ b.style.display='flex'; b.textContent = n > 99 ? '99+' : n; } else { b.style.display='none'; }
}

/* ── ⑦ Firebaseからのリアルタイム同期 ── */
let isFirstLoad = true;
onSnapshot(docRef, (snapshot) => {
  if(snapshot.exists()) {
    __xwgState = { ...__xwgState, ...snapshot.data() };
  }

  if(isFirstLoad) {
    isFirstLoad = false;
    if(XWG_AUTO_HIST) {
      const entry = { url: location.href, title: document.title, ts: Date.now() };
      const hist = _ld(XWG_KEYS.history, []);
      if(!hist.length || hist[0].url !== entry.url){
        hist.unshift(entry);
        if(hist.length > XWG_MAX_HIST) hist.pop();
        _sv(XWG_KEYS.history, hist);
      }
    }
  }
  window.__xwgRenderAll();
  __xwgUpdateBadge();
});
</script>
</body>
</html>
