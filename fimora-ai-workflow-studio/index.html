  prompts: "## AI Video Prompts\n\nSNS Director と同時生成されます。まず左パネルで入力してください。",
  sop:     "## Filmora SOP\n\nSNS Director と同時生成されます。まず左パネルで入力してください。",
};

// ---- Markdown renderer (純粋JS) ----
function renderMd(md) {
  if (!md) return null;
  return md.split("\n").map((line, i) => {
    if (line.startsWith("## "))
      return React.createElement("h2", { key: i, className: "text-lg font-bold mt-5 mb-2 text-orange-600" }, line.slice(3));
    if (line.startsWith("### "))
      return React.createElement("h3", { key: i, className: "text-base font-semibold mt-4 mb-1 text-slate-700" }, line.slice(4));
    if (/^\*\*(.+)\*\*$/.test(line))
      return React.createElement("p", { key: i, className: "font-semibold mt-3 text-slate-800" }, line.replace(/\*\*/g, ""));
    if (line.startsWith("- "))
      return React.createElement("li", { key: i, className: "ml-5 text-slate-600 leading-relaxed list-disc" }, line.slice(2));
    if (line.trim() === "")
      return React.createElement("div", { key: i, className: "h-2" });
    return React.createElement("p", { key: i, className: "text-slate-600 leading-relaxed text-sm" }, line);
  });
}

// ---- API key storage ----
const LS_KEY = "filmora_gemini_api_key";

function App() {
  const [apiKey, setApiKey]       = useState(() => localStorage.getItem(LS_KEY) || "");
  const [showKey, setShowKey]     = useState(false);
  const [keySaved, setKeySaved]   = useState(false);
  const [idea, setIdea]           = useState("");
  const [platforms, setPlatforms] = useState(["X"]);
  const [tab, setTab]             = useState(0);
  const [outputs, setOutputs]     = useState(null);
  const [generating, setGenerating] = useState(false);
  const [error, setError]         = useState("");

  const saveKey = () => {
    localStorage.setItem(LS_KEY, apiKey.trim());
    setKeySaved(true);
    setTimeout(() => setKeySaved(false), 2000);
  };

  const toggle = (p) =>
    setPlatforms(prev => prev.includes(p) ? prev.filter(x => x !== p) : [...prev, p]);

  const generate = async () => {
    if (!idea.trim()) return;
    const key = apiKey.trim();
    if (!key) { setError("APIキーを入力してください。"); return; }
    setError("");
    setGenerating(true);
    setOutputs(null);

    const sys = `あなたは3つの役割を同時に担うAIです。入力されたアイデアメモとターゲット媒体から、以下3セクションをJSON形式で出力してください。キーは sns, prompts, sop です。各値はMarkdown文字列です。

【sns】エンゲージメント特化のSNS台本。結論→要点3つ→構成の順。Xなら180-200文字/投稿でスレッド展開、CTA最後。断定調、曖昧表現禁止。入力アイデアの内容から適切なターゲット層・トーンを自動判断すること。

【prompts】各シーン用の英語AI動画プロンプト。構造: Subject / Action / Environment / Camera Movement / Light Source / Shot Type / Atmosphere。末尾に必ず "masterpiece, ultra detailed, cinematic lighting, physically accurate lighting, high contrast, commercial advertising quality, 8k resolution style" を付与。3〜5シーン生成。

【sop】Filmora 15編集SOP。項目: 1)プロジェクト設定(アスペクト比/FPS) 2)Safe Zone 3)Auto Reframe 4)AI字幕(STT) 5)BGM/音量(-16〜-14 LUFS) 6)書き出し(MP4/H.264,1080x1920) 7)命名規則({date}_{platform}_{campaign}_{angleID}_{v}) 8)トラブルシュート(プロキシ/背景レンダ)。選択媒体別の上限も明記。

JSONのみ出力。バッククォートや説明文は不要。`;

    const userMsg = `アイデアメモ: ${idea}\nターゲット媒体: ${platforms.join(", ")}`;

    try {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: sys }] },
          contents: [{ role: "user", parts: [{ text: userMsg }] }],
          generationConfig: { responseMimeType: "application/json" },
        }),
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(`APIエラー ${res.status}: ${errData?.error?.message || res.statusText}`);
      }

      const data = await res.json();
      const text = data.candidates[0].content.parts[0].text;
      let parsed;
      try {
        parsed = JSON.parse(text);
      } catch {
        const match = text.match(/\{[\s\S]+\}/);
        if (match) parsed = JSON.parse(match[0]);
        else throw new Error("レスポンスのJSONパースに失敗しました。もう一度お試しください。");
      }
      setOutputs(parsed);
      setTab(0);
    } catch (e) {
      const msg = e.message || "不明なエラー";
      setOutputs({
        sns:     `## エラー\n\n⚠ 生成に失敗しました。\n\n**詳細:** ${msg}\n\n**よくある原因:**\n- APIキーが正しくない（Google AI StudioのAPIキーを確認）\n- インターネット接続を確認\n- しばらく待ってから再試行`,
        prompts: `## エラー\n\nSNS Directorタブのエラー内容を確認してください。`,
        sop:     `## エラー\n\nSNS Directorタブのエラー内容を確認してください。`,
      });
    }
    setGenerating(false);
  };

  const TABS = [
    { label: "SNS Director",    icon: "📝", key: "sns" },
    { label: "AI Video Prompts", icon: "🎬", key: "prompts" },
    { label: "Filmora SOP",     icon: "🎛️", key: "sop" },
  ];

  const content = outputs ? outputs[TABS[tab].key] : EMPTY[TABS[tab].key];

  return React.createElement("div", { className: "min-h-screen bg-slate-50 text-slate-800" },

    // ── Header ──
    React.createElement("header", { className: "bg-white border-b border-slate-200 px-6 py-3 flex items-center gap-3 sticky top-0 z-20 shadow-sm" },
      React.createElement("div", { className: "w-9 h-9 rounded-xl bg-gradient-to-br from-orange-500 to-amber-500 flex items-center justify-center text-white font-bold text-lg shadow-sm" }, "F"),
      React.createElement("div", null,
        React.createElement("h1", { className: "text-base font-bold tracking-tight text-slate-900" }, "Filmora AI Workflow Studio"),
        React.createElement("p",  { className: "text-xs text-slate-400" }, "アイデア → 台本 → プロンプト → SOP を一気通貫生成")
      )
    ),

    // ── Body ──
    React.createElement("div", { className: "flex flex-col lg:flex-row" },

      // ── Sidebar ──
      React.createElement("aside", {
        className: "lg:w-[340px] w-full border-b lg:border-b-0 lg:border-r border-slate-200 bg-white p-5 flex-shrink-0 lg:max-h-[calc(100vh-57px)] lg:overflow-y-auto"
      },

        // APIキー入力
        React.createElement("div", { className: "mb-4 p-3 bg-amber-50 border border-amber-200 rounded-xl" },
          React.createElement("label", { className: "text-xs font-semibold text-amber-800 block mb-1.5" }, "🔑 Gemini APIキー"),
          React.createElement("div", { className: "flex gap-1.5" },
            React.createElement("input", {
              type: showKey ? "text" : "password",
              className: "key-input flex-1 min-w-0 border border-amber-300 rounded-lg px-2.5 py-1.5 text-xs text-slate-700 bg-white placeholder-slate-400",
              placeholder: "AIza...",
              value: apiKey,
              onChange: e => setApiKey(e.target.value),
            }),
            React.createElement("button", {
              onClick: () => setShowKey(v => !v),
              className: "px-2 py-1.5 text-xs border border-amber-300 rounded-lg text-amber-700 bg-white hover:bg-amber-100 flex-shrink-0",
            }, showKey ? "隠す" : "表示"),
            React.createElement("button", {
              onClick: saveKey,
              className: "px-2 py-1.5 text-xs rounded-lg font-semibold flex-shrink-0 " + (keySaved ? "bg-green-500 text-white" : "bg-amber-500 text-white hover:bg-amber-600"),
            }, keySaved ? "✓" : "保存"),
          ),
          React.createElement("p", { className: "text-xs text-amber-600 mt-1.5" },
            "キーは",
            React.createElement("a", { href: "https://aistudio.google.com/app/apikey", target: "_blank", className: "underline font-medium" }, "Google AI Studio"),
            "で取得。ブラウザにのみ保存されます。"
          ),
          error ? React.createElement("p", { className: "text-xs text-red-600 mt-1.5 font-medium" }, "⚠ " + error) : null,
        ),

        // アイデアメモ
        React.createElement("label", { className: "text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-1.5" }, "アイデアメモ"),
        React.createElement("textarea", {
          className: "w-full h-24 bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400/40 focus:border-orange-400 resize-none",
          placeholder: "下のサンプルをクリック、または自由に入力...",
          value: idea,
          onChange: e => setIdea(e.target.value),
        }),

        // ターゲット媒体
        React.createElement("label", { className: "text-xs font-semibold text-slate-500 uppercase tracking-wider block mt-4 mb-2" }, "ターゲット媒体"),
        React.createElement("div", { className: "flex flex-wrap gap-2" },
          PLATFORMS.map(p =>
            React.createElement("button", {
              key: p,
              onClick: () => toggle(p),
              className: "chip-btn px-3 py-1.5 rounded-full text-xs font-semibold border " + (
                platforms.includes(p)
                  ? "bg-orange-500 border-orange-500 text-white shadow-sm"
                  : "bg-white border-slate-300 text-slate-500 hover:border-slate-400"
              ),
            }, p)
          )
        ),

        // 生成ボタン
        React.createElement("button", {
          onClick: generate,
          disabled: generating || !idea.trim() || !apiKey.trim(),
          className: "w-full mt-4 py-2.5 rounded-lg bg-gradient-to-r from-orange-500 to-amber-500 text-sm font-bold text-white hover:opacity-90 transition shadow-sm disabled:opacity-40 disabled:cursor-not-allowed",
        },
          generating
            ? React.createElement("span", { className: "flex items-center justify-center gap-2" },
                React.createElement("span", { className: "spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full" }),
                "生成中..."
              )
            : "生成実行 →"
        ),

        // サンプルアイデア
        React.createElement("div", { className: "mt-5 pt-4 border-t border-slate-100" },
          React.createElement("p", { className: "text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3" }, "💡 アイデアサンプル"),
          CATEGORIES.map(cat =>
            React.createElement("div", { key: cat.label, className: "mb-4" },
              React.createElement("p", { className: "text-xs font-bold text-slate-500 mb-1.5" }, cat.label),
              React.createElement("div", { className: "flex flex-col gap-1" },
                SAMPLE_IDEAS.slice(cat.range[0], cat.range[1]).map((s, i) =>
                  React.createElement("button", {
                    key: i,
                    onClick: () => setIdea(s),
                    className: "chip-btn text-left px-3 py-2 rounded-lg text-xs leading-snug border w-full " + (
                      idea === s
                        ? "bg-orange-50 border-orange-300 text-orange-700 font-medium"
                        : "bg-slate-50 border-slate-200 text-slate-600 hover:bg-white hover:border-slate-300"
                    ),
                  }, s)
                )
              )
            )
          )
        )
      ),

      // ── Main ──
      React.createElement("main", { className: "flex-1 p-5 lg:p-6" },

        // Tabs
        React.createElement("div", { className: "flex gap-1 mb-4 bg-slate-100 rounded-xl p-1 w-fit" },
          TABS.map((t, i) =>
            React.createElement("button", {
              key: i,
              onClick: () => setTab(i),
              className: "px-4 py-2 rounded-lg text-sm font-semibold transition-all " + (
                tab === i ? "bg-white text-orange-600 shadow-sm" : "text-slate-500 hover:text-slate-700"
              ),
            }, t.icon + " " + t.label)
          )
        ),

        // Output
        React.createElement("div", {
          className: "bg-white border border-slate-200 rounded-2xl p-6 min-h-[60vh] overflow-auto shadow-sm"
        },
          generating
            ? React.createElement("div", { className: "flex flex-col items-center justify-center h-64 text-slate-400" },
                React.createElement("div", { className: "spin w-8 h-8 border-2 border-orange-400 border-t-transparent rounded-full mb-3" }),
                React.createElement("p", { className: "text-sm font-medium" }, "AI が台本・プロンプト・SOPを同時生成中..."),
                React.createElement("p", { className: "text-xs mt-1 text-slate-300" }, "通常15〜30秒かかります")
              )
            : React.createElement("div", null, renderMd(content))
        )
      )
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>

  box-shadow:0 8px 40px rgba(42,38,32,.18), 0 2px 10px rgba(42,38,32,.1);
  display:none; flex-direction:column; overflow:hidden;
  font-family:'Noto Sans JP',system-ui,sans-serif;
  animation:__xwg_in .22s ease;
}
@keyframes __xwg_in{ from{opacity:0;transform:translateY(8px) scale(.97);} to{opacity:1;transform:none;} }
#__xwg_panel.open{ display:flex; }
.__xwg_head{ background:#fff; padding:10px 14px; display:flex; align-items:center; gap:6px; border-bottom:1.5px solid #ede8db; flex-shrink:0; }
.__xwg_logo{ font-size:1.1rem; }
.__xwg_title{ font-size:.85rem; font-weight:700; color:#2a2620; flex:1; letter-spacing:.02em; }
.__xwg_close{ width:26px; height:26px; border-radius:50%; border:none; cursor:pointer; background:#f3efe5; color:#8c8278; font-size:.9rem; display:flex; align-items:center; justify-content:center; transition:all .15s; }
.__xwg_close:hover{ background:#ede8db; color:#2a2620; }
.__xwg_tabs{ display:flex; gap:3px; padding:6px 8px; background:#faf8f2; border-bottom:1px solid #ede8db; flex-shrink:0; }
.__xwg_tab{ flex:1; padding:6px 4px; border:none; border-radius:6px; cursor:pointer; font-family:inherit; font-size:.68rem; font-weight:700; background:transparent; color:#8c8278; transition:all .16s; display:flex; flex-direction:column; align-items:center; gap:1px; }
.__xwg_tab .ti{ font-size:.95rem; }
.__xwg_tab:hover:not(.on){ background:#f3efe5; color:#4a4540; }
.__xwg_tab.on{ background:#d95235; color:#fff; border-radius:6px; }
.__xwg_body{ flex:1; overflow-y:auto; padding:10px; }
.__xwg_pane{ display:none; }
.__xwg_pane.on{ display:block; }
.__xwg_card{ background:#fff; border:1px solid #ddd8ce; border-radius:9px; padding:11px 12px; margin-bottom:8px; }
.__xwg_card:last-child{ margin-bottom:0; }
.__xwg_card_title{ font-size:.7rem; font-weight:700; color:#8c8278; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid #f3efe5; }
.__xwg_inp{ width:100%; padding:7px 10px; background:#faf8f2; border:1.5px solid #ddd8ce; border-radius:7px; font-size:.82rem; outline:none; box-sizing:border-box;}
.__xwg_inp:focus{ border-color:#0e7ea4; background:#fff; }
.__xwg_inp.ta{ resize:vertical; min-height:60px; }
.__xwg_sel{ width:100%; padding:6px 10px; background:#faf8f2; border:1.5px solid #ddd8ce; border-radius:7px; font-size:.8rem; outline:none; box-sizing:border-box;}
.__xwg_row{ display:flex; gap:6px; margin-top:5px; }
.__xwg_row .__xwg_inp{ flex:1; margin-top:0; }
.__xwg_row .__xwg_sel{ flex:0 0 100px; }
.__xwg_btn_s{ padding:6px 11px; border:none; border-radius:6px; cursor:pointer; font-weight:700; transition:all .14s; }
.__xwg_btn_co{ background:#d95235; color:#fff; }
.__xwg_btn_am{ background:#c47e10; color:#fff; }
.__xwg_btn_da{ background:#fdf0ec; color:#d95235; border:1.5px solid #f5c4b8; }
.__xwg_full{ width:100%; padding:8px; margin-top:8px; }
.__xwg_hi{ background:#e8f5fa; border:1px solid #b0d8ea; border-radius:7px; padding:8px 10px; margin-bottom:6px; }
.__xwg_hi_url{ font-size:.68rem; color:#0e7ea4; word-break:break-all; margin-bottom:3px; }
.__xwg_hi_title{ font-size:.76rem; color:#2a2620; font-weight:500; margin-bottom:5px; }
.__xwg_hi_meta{ display:flex; justify-content:space-between; align-items:center; }
.__xwg_hi_date{ font-size:.63rem; color:#8c8278; }
.__xwg_hi_btns{ display:flex; gap:3px; }
.__xwg_hbtn{ font-size:.63rem; padding:2px 7px; border:1.5px solid; border-radius:4px; cursor:pointer; font-weight:700; }
.__xwg_hbtn_go{ border-color:#a8dcc4; color:#2a8c5e; background:#e8f7f0; }
.__xwg_hbtn_cp{ border-color:#b0d8ea; color:#0e7ea4; background:#e8f5fa; }
.__xwg_hbtn_dl{ border-color:#f5c4b8; color:#d95235; background:#fdf0ec; }
.__xwg_tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.__xwg_tag{ display:inline-flex; align-items:center; gap:3px; padding:3px 8px; border-radius:14px; font-size:.7rem; cursor:pointer; border:1.5px solid; }
.__xwg_tag .td{ opacity:.45; font-size:.8rem; }
.__xwg_tag.pain   { background:#fdf0ec; border-color:#f5c4b8; color:#d95235; }
.__xwg_tag.benefit{ background:#e8f7f0; border-color:#a8dcc4; color:#2a8c5e; }
.__xwg_tag.custom { background:#e8f5fa; border-color:#b0d8ea; color:#0e7ea4; }
.__xwg_tag.account{ background:#fdf6e3; border-color:#f0d898; color:#c47e10; }
.__xwg_sub{ font-size:.65rem; font-weight:700; color:#8c8278; margin-top:8px; margin-bottom:5px; }
.__xwg_hr{ border:none; border-top:1px solid #ede8db; margin:8px 0; }
.__xwg_mi{ background:#fdf6e3; border:1.5px solid #f0d898; border-radius:7px; padding:9px 10px 9px 14px; margin-bottom:6px; position:relative; }
.__xwg_mi::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:#c47e10; border-radius:4px 0 0 4px; }
.__xwg_mi_ttl{ font-size:.78rem; font-weight:700; margin-bottom:3px; display:flex; justify-content:space-between; }
.__xwg_mi_body{ font-size:.74rem; line-height:1.6; white-space:pre-wrap; word-break:break-all; }
.__xwg_mi_date{ font-size:.62rem; color:#8c8278; margin-top:5px; }
.__xwg_empty{ text-align:center; padding:20px 10px; color:#8c8278; font-size:.76rem; }
.__xwg_empty .ei{ font-size:1.5rem; margin-bottom:5px; }
.__xwg_flash{ animation:__xwg_fl .6s ease; }
@keyframes __xwg_fl{ 40%{ background:#e8f5fa; border-color:#0e7ea4; } }
`;
const style = document.createElement('style');
style.textContent = _css;
document.head.appendChild(style);

/* ── ⑤ DOM構築 ── */
const anchor = document.getElementById('__xwg_anchor');
anchor.innerHTML = `
<button id="__xwg_btn" onclick="__xwgToggle()" title="メモ・ワード・履歴を開く">
  📌<span class="xwg-badge" id="__xwg_hbadge"></span>
</button>

<div id="__xwg_panel">
  <div class="__xwg_head">
    <span class="__xwg_logo">🗂️</span>
    <span class="__xwg_title">メモ・ワード・履歴</span>
    <button class="__xwg_close" onclick="__xwgClose()">✕</button>
  </div>
  <div class="__xwg_tabs">
    <button class="__xwg_tab on" onclick="__xwgTab('h',this)"><span class="ti">🕐</span>履歴</button>
    <button class="__xwg_tab"   onclick="__xwgTab('w',this)"><span class="ti">📌</span>ワード</button>
    <button class="__xwg_tab"   onclick="__xwgTab('m',this)"><span class="ti">📝</span>メモ</button>
  </div>
  <div class="__xwg_body">

    <div class="__xwg_pane on" id="__xwg_ph">
      <div class="__xwg_card">
        <div class="__xwg_card_title">🕐 ページ訪問履歴</div>
        <div id="__xwg_hlist"></div>
      </div>
      <div style="text-align:right;margin-top:4px;">
        <button class="__xwg_btn_s __xwg_btn_da" onclick="__xwgClearHist()">全削除</button>
      </div>
    </div>

    <div class="__xwg_pane" id="__xwg_pw">
      <div class="__xwg_card">
        <div class="__xwg_card_title">＋ ワードを登録</div>
        <input class="__xwg_inp" type="text" id="__xwg_nw" placeholder="ワード・フレーズ">
        <div class="__xwg_row">
          <select class="__xwg_sel" id="__xwg_nc">
            <option value="custom">🏷 カスタム</option>
            <option value="pain">😤 ペイン</option>
            <option value="benefit">✨ ベネフィット</option>
            <option value="account">👤 アカウント</option>
          </select>
          <input class="__xwg_inp" type="text" id="__xwg_nl" placeholder="ラベル名">
        </div>
        <button class="__xwg_btn_s __xwg_btn_co __xwg_full" onclick="__xwgRegWord()">＋ 登録する</button>
      </div>
      <div class="__xwg_card">
        <div class="__xwg_card_title">登録済みワード</div>
        <div id="__xwg_wtags"></div>
      </div>
    </div>

    <div class="__xwg_pane" id="__xwg_pm">
      <div class="__xwg_card">
        <div class="__xwg_card_title">📝 メモを追加</div>
        <input class="__xwg_inp" type="text" id="__xwg_mt" placeholder="タイトル">
        <textarea class="__xwg_inp ta" id="__xwg_mb" placeholder="本文…" style="margin-top:5px;"></textarea>
        <button class="__xwg_btn_s __xwg_btn_am __xwg_full" onclick="__xwgAddMemo()">保存</button>
      </div>
      <div class="__xwg_card">
        <div class="__xwg_card_title">メモ一覧</div>
        <div id="__xwg_mlist"></div>
      </div>
    </div>

  </div>
</div>
`;

/* ── ⑥ UIロジック ── */
let __xwg_open = false;

window.__xwgToggle = () => {
  __xwg_open = !__xwg_open;
  const panel = document.getElementById('__xwg_panel');
  if(__xwg_open){
    panel.classList.add('open');
    window.__xwgRenderAll();
  } else {
    panel.classList.remove('open');
  }
};
window.__xwgClose = () => {
  __xwg_open = false; document.getElementById('__xwg_panel').classList.remove('open');
};
window.__xwgTab = (id, btn) => {
  document.querySelectorAll('.__xwg_pane').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.__xwg_tab').forEach(t=>t.classList.remove('on'));
  document.getElementById({h:'__xwg_ph',w:'__xwg_pw',m:'__xwg_pm'}[id]).classList.add('on');
  btn.classList.add('on');
  window.__xwgRenderAll();
};

window.__xwgRenderAll = () => {
  if(!__xwg_open) return;
  __xwgRenderHist(); __xwgRenderWords(); __xwgRenderMemos();
};

function __xwgRenderHist(){
  const list = _ld(XWG_KEYS.history, []);
  const el = document.getElementById('__xwg_hlist');
  if(!list.length) return el.innerHTML = '<div class="__xwg_empty"><div class="ei">🕐</div>履歴がありません</div>';
  el.innerHTML = list.map((h,i) => `
    <div class="__xwg_hi">
      <div class="__xwg_hi_title">${_esc(h.title || '(タイトルなし)')}</div>
      <div class="__xwg_hi_url">${_esc(h.url)}</div>
      <div class="__xwg_hi_meta">
        <span class="__xwg_hi_date">${_fmt(h.ts)}</span>
        <div class="__xwg_hi_btns">
          <button class="__xwg_hbtn __xwg_hbtn_go" onclick="window.open('${_ea(h.url)}','_blank')">開く</button>
          <button class="__xwg_hbtn __xwg_hbtn_cp" onclick="__xwgCopy('${_ea(h.url)}',this)">コピー</button>
          <button class="__xwg_hbtn __xwg_hbtn_dl" onclick="__xwgDelHist(${i})">✕</button>
        </div>
      </div>
    </div>`).join('');
}
window.__xwgDelHist = (i) => { const l=_ld(XWG_KEYS.history,[]); l.splice(i,1); _sv(XWG_KEYS.history, l); };
window.__xwgClearHist = () => { if(confirm('全削除しますか？')) _sv(XWG_KEYS.history, []); };

window.__xwgRegWord = () => {
  const word = document.getElementById('__xwg_nw').value.trim();
  const cat  = document.getElementById('__xwg_nc').value;
  const label = document.getElementById('__xwg_nl').value.trim() || word;
  if(!word) return alert('ワードを入力してください。');
  const words = _ld(XWG_KEYS.words, []);
  words.push({id: Date.now(), word, cat, label, ts: Date.now()});
  _sv(XWG_KEYS.words, words);
  document.getElementById('__xwg_nw').value = ''; document.getElementById('__xwg_nl').value = '';
};
window.__xwgDelWord = (id) => _sv(XWG_KEYS.words, _ld(XWG_KEYS.words,[]).filter(w=>w.id!==id));

function __xwgRenderWords(){
  const words = _ld(XWG_KEYS.words, []);
  const el = document.getElementById('__xwg_wtags');
  if(!words.length) return el.innerHTML = '<div class="__xwg_empty"><div class="ei">📌</div>登録がありません</div>';
  const cats = ['pain','benefit','custom','account'];
  const labels = {pain:'😤 ペイン',benefit:'✨ ベネフィット',custom:'🏷 カスタム',account:'👤 アカウント'};
  let html = '';
  cats.forEach(cat => {
    const cw = words.filter(w=>w.cat===cat);
    if(!cw.length) return;
    html += `<div class="__xwg_sub">${labels[cat]}</div><div class="__xwg_tags">` + cw.map(w=>`
      <span class="__xwg_tag ${w.cat}" title="${_esc(w.word)}" onclick="__xwgCopy('${_ea(w.word)}',this)">
        <span class="tl">${_esc(w.label)}</span>
        <span class="td" onclick="event.stopPropagation();__xwgDelWord(${w.id})">✕</span>
      </span>`).join('') + `</div><div class="__xwg_hr"></div>`;
  });
  el.innerHTML = html;
}

window.__xwgAddMemo = () => {
  const title = document.getElementById('__xwg_mt').value.trim();
  const body  = document.getElementById('__xwg_mb').value.trim();
  if(!title && !body) return;
  const memos = _ld(XWG_KEYS.memos, []);
  memos.unshift({id:Date.now(), title:title||'（無題）', body, ts:Date.now()});
  _sv(XWG_KEYS.memos, memos);
  document.getElementById('__xwg_mt').value = ''; document.getElementById('__xwg_mb').value = '';
};
window.__xwgDelMemo = (id) => _sv(XWG_KEYS.memos, _ld(XWG_KEYS.memos,[]).filter(m=>m.id!==id));

function __xwgRenderMemos(){
  const memos = _ld(XWG_KEYS.memos, []);
  const el = document.getElementById('__xwg_mlist');
  if(!memos.length) return el.innerHTML = '<div class="__xwg_empty"><div class="ei">📝</div>メモがありません</div>';
  el.innerHTML = memos.map(m=>`
    <div class="__xwg_mi">
      <div class="__xwg_mi_ttl"><span>${_esc(m.title)}</span>
        <button class="__xwg_hbtn __xwg_hbtn_dl" onclick="__xwgDelMemo(${m.id})">✕</button>
      </div>
      <div class="__xwg_mi_body">${_esc(m.body)}</div>
      <div class="__xwg_mi_date">${_fmt(m.ts)}</div>
    </div>`).join('');
}

window.__xwgCopy = (text, el) => {
  navigator.clipboard.writeText(text).then(()=>{
    if(el){ el.classList.add('__xwg_flash'); setTimeout(()=>el.classList.remove('__xwg_flash'),700); }
  });
};

function __xwgUpdateBadge(){
  const n = _ld(XWG_KEYS.history, []).length;
  const b = document.getElementById('__xwg_hbadge');
  if(n > 0){ b.style.display='flex'; b.textContent = n > 99 ? '99+' : n; } else { b.style.display='none'; }
}

/* ── ⑦ Firebaseからのリアルタイム同期 ── */
let isFirstLoad = true;

onSnapshot(docRef, (snapshot) => {
  if(snapshot.exists()) {
    __xwgState = { ...__xwgState, ...snapshot.data() };
  }

  if(isFirstLoad) {
    isFirstLoad = false;
    if(XWG_AUTO_HIST) {
      const entry = { url: location.href, title: document.title, ts: Date.now() };
      const hist = _ld(XWG_KEYS.history, []);
      if(!hist.length || hist[0].url !== entry.url){
        hist.unshift(entry);
        if(hist.length > XWG_MAX_HIST) hist.pop();
        _sv(XWG_KEYS.history, hist);
      }
    }
  }

  window.__xwgRenderAll();
  __xwgUpdateBadge();
});

</script>
</body>
</html>
