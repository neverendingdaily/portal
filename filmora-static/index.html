<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 Filmora マニュアル生成</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    #manualOutput h1 {
      font-size: 1.35rem; font-weight: 700; margin: 1.4rem 0 0.6rem;
      color: #1e1b4b; border-bottom: 2px solid #ddd6fe; padding-bottom: 0.3rem;
    }
    #manualOutput h2 {
      font-size: 1.1rem; font-weight: 700; margin: 1.1rem 0 0.4rem; color: #4c1d95;
    }
    #manualOutput h3 {
      font-size: 0.95rem; font-weight: 600; margin: 0.9rem 0 0.3rem; color: #5b21b6;
    }
    #manualOutput p { margin: 0.4rem 0; line-height: 1.75; color: #374151; font-size: 0.875rem; }
    #manualOutput ul {
      list-style-type: disc; padding-left: 1.5rem; margin: 0.5rem 0;
    }
    #manualOutput ol {
      list-style-type: decimal; padding-left: 1.5rem; margin: 0.5rem 0;
    }
    #manualOutput li {
      margin: 0.25rem 0; font-size: 0.875rem; color: #374151;
      line-height: 1.65; list-style: inherit;
    }
    #manualOutput li > ul { list-style-type: circle; margin: 0.2rem 0; }
    #manualOutput li > ol { margin: 0.2rem 0; }
    #manualOutput .task-list-item { list-style: none; padding-left: 0; }
    #manualOutput .task-list-item input[type="checkbox"] {
      margin-right: 0.45rem; width: 0.9rem; height: 0.9rem;
      accent-color: #7c3aed; cursor: default; vertical-align: middle; flex-shrink: 0;
    }
    #manualOutput .contains-task-list { list-style: none; padding-left: 0.25rem; }
    #manualOutput table {
      border-collapse: collapse; min-width: 100%; margin: 0.7rem 0;
      font-size: 0.8rem; display: block; overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    #manualOutput thead { background: #ede9fe; }
    #manualOutput th {
      color: #4c1d95; font-weight: 600; padding: 0.4rem 0.75rem;
      text-align: left; border: 1px solid #c4b5fd; white-space: nowrap;
    }
    #manualOutput td {
      padding: 0.35rem 0.75rem; border: 1px solid #e5e7eb;
      color: #374151; white-space: normal; word-break: break-word;
    }
    #manualOutput tr:nth-child(even) td { background: #faf5ff; }
    #manualOutput hr { border: none; border-top: 2px solid #ede9fe; margin: 1.4rem 0; }
    #manualOutput code {
      background: #f3f4f6; padding: 0.1rem 0.35rem; border-radius: 3px;
      font-size: 0.8rem; color: #7c3aed; word-break: break-all;
    }
    #manualOutput pre {
      background: #f3f4f6; border-radius: 6px; padding: 0.75rem 1rem;
      overflow-x: auto; margin: 0.5rem 0;
    }
    #manualOutput pre code { background: none; padding: 0; word-break: normal; }
    #manualOutput strong { color: #1e1b4b; font-weight: 700; }
    #manualOutput em { color: #4b5563; font-style: italic; }
    #manualOutput blockquote {
      border-left: 3px solid #c4b5fd; padding-left: 0.75rem;
      color: #6b7280; font-style: italic; margin: 0.5rem 0;
    }
    #manualOutput.streaming::after {
      content: '▌'; color: #7c3aed; animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    @media (min-width: 1024px) {
      #mainLayout   { height: calc(100vh - var(--header-h, 57px)); overflow: hidden; }
      #ideasCol     { overflow: hidden; }
      #ideasContainer { flex: 1 1 0; overflow-y: auto; min-height: 0; }
      #rightCol     { overflow: hidden; }
      #outputSection { flex: 1 1 0; min-height: 0; overflow: hidden; }
      #manualOutput  { flex: 1 1 0; overflow-y: auto; min-height: 0; }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">

  <header id="appHeader" class="bg-white border-b border-gray-200 px-4 py-3 sticky top-0 z-20 shadow-sm">
    <div class="max-w-7xl mx-auto flex flex-col gap-2 sm:flex-row sm:items-center sm:gap-4">
      <h1 class="text-base font-bold text-violet-700 leading-tight whitespace-nowrap">
        🎬 Filmora マニュアル生成
      </h1>
      <div class="flex items-center gap-2 sm:flex-1 sm:max-w-xs sm:ml-auto">
        <label for="apiKeyInput" class="text-xs text-gray-500 font-medium whitespace-nowrap">
          🔑 <span class="hidden sm:inline">Gemini API キー</span><span class="sm:hidden">API キー</span>
        </label>
        <div class="flex flex-1 rounded-lg border border-gray-300 overflow-hidden
                    focus-within:border-violet-500 focus-within:ring-2 focus-within:ring-violet-100 transition-all">
          <input
            id="apiKeyInput"
            type="password"
            placeholder="AIza..."
            autocomplete="off"
            class="flex-1 px-3 py-1.5 text-sm outline-none bg-white min-w-0"
          />
          <button id="toggleApiKey"
            class="px-2.5 text-gray-400 hover:text-gray-600 bg-white border-l border-gray-200 transition-colors"
            aria-label="APIキー表示切替">👁</button>
        </div>
      </div>
    </div>
  </header>

  <div id="mainLayout" class="max-w-7xl mx-auto p-3 sm:p-4 flex flex-col gap-3 sm:gap-4 lg:flex-row lg:gap-4">

    <div id="ideasCol" class="flex flex-col gap-3 lg:w-72 lg:shrink-0">
      <div class="bg-white rounded-xl border border-gray-200 p-3 flex flex-col gap-2 shrink-0">
        <div class="flex items-center justify-between">
          <h2 class="font-bold text-sm text-gray-700">📋 SNS アイディア</h2>
          <span id="ideaCount" class="text-xs text-gray-400"></span>
        </div>
        <label
          id="fileLabel"
          class="flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg
                 border-2 border-dashed border-violet-300 text-violet-600 text-xs font-medium
                 cursor-pointer hover:bg-violet-50 active:bg-violet-100 transition-colors"
        >
          📂 テキストファイルを選択
          <input id="fileInput" type="file" accept=".md,.txt,.text" class="hidden" />
        </label>
        <p class="text-xs text-gray-400 text-center leading-relaxed">
          .md / .txt どちらでも可<br>Discordのコピペを保存したファイルもOK
        </p>
      </div>

      <div id="ideasContainer"
        class="flex flex-col gap-2 max-h-56 overflow-y-auto pr-0.5 sm:max-h-64 lg:max-h-none">
      </div>
    </div>

    <div id="rightCol" class="flex flex-col gap-3 lg:flex-1 lg:min-w-0">

      <div class="bg-white rounded-xl border border-gray-200 p-3 flex flex-col gap-2.5 shrink-0">
        <div class="flex items-center justify-between flex-wrap gap-2">
          <h2 class="font-bold text-sm text-gray-700">⚙️ Filmora Pro 機能</h2>
          <div class="flex items-center gap-1.5">
            <span id="featureCount" class="text-xs text-gray-400 mr-1"></span>
            <button id="selectAllFeatures"
              class="text-xs px-2.5 py-1 rounded-md border border-violet-300 text-violet-600
                     hover:bg-violet-50 active:bg-violet-100 transition-colors">全選択</button>
            <button id="clearAllFeatures"
              class="text-xs px-2.5 py-1 rounded-md border border-gray-200 text-gray-500
                     hover:bg-gray-50 active:bg-gray-100 transition-colors">解除</button>
          </div>
        </div>

        <input
          id="featureSearch"
          type="search"
          placeholder="🔍 機能を検索..."
          class="w-full px-3 py-2 text-sm rounded-lg border border-gray-200
                 focus:outline-none focus:border-violet-400 focus:ring-2 focus:ring-violet-100 transition-all"
        />

        <div id="categoryTabs"
          class="flex gap-1.5 overflow-x-auto pb-1 scrollbar-hide -mx-0.5 px-0.5">
          <button data-category="all"
            class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors cursor-pointer border
                   bg-violet-600 text-white border-violet-600">すべて</button>
          <button data-category="ai"
            class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors cursor-pointer border
                   bg-white text-gray-600 border-gray-200 hover:border-violet-300">🤖 AI</button>
          <button data-category="editing"
            class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors cursor-pointer border
                   bg-white text-gray-600 border-gray-200 hover:border-violet-300">✂️ 編集</button>
          <button data-category="transition"
            class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors cursor-pointer border
                   bg-white text-gray-600 border-gray-200 hover:border-violet-300">🎬 TR</button>
          <button data-category="effect"
            class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors cursor-pointer border
                   bg-white text-gray-600 border-gray-200 hover:border-violet-300">✨ エフェクト</button>
          <button data-category="filter"
            class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors cursor-pointer border
                   bg-white text-gray-600 border-gray-200 hover:border-violet-300">🎨 フィルター</button>
          <button data-category="title"
            class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors cursor-pointer border
                   bg-white text-gray-600 border-gray-200 hover:border-violet-300">💬 タイトル</button>
          <button data-category="audio"
            class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors cursor-pointer border
                   bg-white text-gray-600 border-gray-200 hover:border-violet-300">🎵 Audio</button>
          <button data-category="sticker"
            class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors cursor-pointer border
                   bg-white text-gray-600 border-gray-200 hover:border-violet-300">🌟 ステッカー</button>
          <button data-category="template"
            class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors cursor-pointer border
                   bg-white text-gray-600 border-gray-200 hover:border-violet-300">📋 テンプレート</button>
        </div>

        <div id="featuresContainer"
          class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-48 sm:max-h-52 overflow-y-auto pr-0.5">
        </div>
      </div>

      <div class="bg-white rounded-xl border border-gray-200 p-3 shrink-0">
        <p id="selectionSummary" class="text-sm text-center text-gray-400 mb-2 min-h-[1.25rem]"></p>
        <button
          id="generateBtn"
          disabled
          class="w-full py-3 rounded-xl font-bold text-sm
                 bg-gray-100 text-gray-400 cursor-not-allowed transition-all"
        >
          🎬 マニュアルを生成する
        </button>
      </div>

      <div id="outputSection"
        class="flex flex-col gap-2 hidden bg-white rounded-xl border border-gray-200 p-3">
        <div class="flex items-center justify-between shrink-0">
          <h2 class="font-bold text-sm text-gray-700">📄 生成マニュアル</h2>
          <div class="flex gap-2">
            <button id="copyBtn"
              class="hidden text-xs px-3 py-1.5 rounded-lg border border-violet-300 text-violet-600
                     hover:bg-violet-50 active:bg-violet-100 transition-colors font-medium">📋 コピー</button>
            <button id="downloadBtn"
              class="hidden text-xs px-3 py-1.5 rounded-lg bg-violet-600 hover:bg-violet-700 active:bg-violet-800
                     text-white transition-colors font-medium">⬇ .md 保存</button>
          </div>
        </div>
        <div
          id="manualOutput"
          class="text-sm leading-relaxed rounded-lg bg-gray-50 border border-gray-100 p-3
                 min-h-48 overflow-y-auto lg:min-h-0"
        ></div>
      </div>

    </div>
  </div>

  <script>
  // ═══════════════════════════════════════════════════════
  // features.js — Filmora Pro 機能データ
  // ═══════════════════════════════════════════════════════

    { id:'planar-tracking', name:'平面トラッキング', icon:'📌', category:'editing',

    { id:'speed-ramp', name:'スピードランプ', icon:'🚀', category:'editing',
      description:'映画的な速度変化カーブでダイナミックな演出を追加。',

      description:'BGMのビートポイントに映像カットを自動同期。',

    { id:'multicam', name:'マルチカメラ編集', icon:'🎥', category:'editing',
      description:'複数カメラ映像を同期してライブ切り替え編集。',
      operationSteps:['複数カメラのクリップをすべてインポート','クリップを選択して右クリック → マルチカメラクリップを作成','同期基準（音声/タイムコード）を選択して自動同期','マルチカメラビューアでアングルをリアルタイム切り替え','切り替えポイントを細かく調整してFX・テキストを追加'] },

    const prompt = `あなたはSNS投稿アイディアを抽出するアシスタントです。
以下のテキストは、Discordのコピペ・Markdownメモ・箇条書きなど、あらゆる形式のSNS投稿アイディアのメモです。

このテキストの中から「SNS投稿のアイディア」として読み取れるものを最大6件抽出し、以下のJSONスキーマで返してください。

【JSONスキーマ】
{

【抽出ルール】
- フォーマットが崩れていたり、口語・メモ書き程度のものでも、意味が読み取れればアイディアとして抽出する
- 明らかに投稿アイディアでない雑談・日付・URLのみの行は無視する
- 複数のアイディアが混在する場合は別々のエントリに分ける
- 必ずJSONのみを返す（前後に説明テキストを付けない）

【テキスト】
${text.slice(0, 8000)}`;

    const url =
      'https://generativelanguage.googleapis.com/v1beta/models/' +
      'gemini-2.5-flash:generateContent?key=' + encodeURIComponent(apiKey);

    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ role: 'user', parts: [{ text: prompt }] }],
        generationConfig: {
          responseMimeType: 'application/json',
          temperature: 0.1,
          maxOutputTokens: 4096,
        },
      }),
    });

    if (!response.ok) {
      let errMsg = 'Gemini APIエラー: ' + response.status + ' ' + response.statusText;
      try {
        const errJson = await response.json();
        if (errJson?.error?.message) errMsg += ' — ' + errJson.error.message;
      } catch {}
      throw new Error(errMsg);
    }

    const data = await response.json();
    const responseText = data?.candidates?.[0]?.content?.parts?.[0]?.text ?? '';

    let parsed;
    try {
      parsed = JSON.parse(responseText);
    } catch {
      throw new Error('AIからのレスポンスをJSONとして解析できませんでした。もう一度試してください。');
    }

    const ideas = (parsed.ideas ?? []).slice(0, 6).map((idea, i) => ({
      index: i + 1,
      genreNumber: idea.genreNumber ?? '',
      genreLabel: idea.genreLabel ?? '',
      title: idea.title ?? '',
      format: idea.format === 'x-thread' ? 'x-thread' : 'instagram-carousel',

      essence: idea.essence ?? '',
      content: idea.content ?? '',
      caption: idea.caption ?? '',
      cta: idea.cta ?? '',
    }));

    return {
      date: parsed.date ?? '',
      rawDate: parsed.rawDate ?? '',
      ideas,
    };
  }

  // ═══════════════════════════════════════════════════════
  // gemini.js — ストリーミングクライアント
  // ═══════════════════════════════════════════════════════
  async function* streamGemini(apiKey, systemPrompt, userPrompt) {
    const url =
      'https://generativelanguage.googleapis.com/v1beta/models/' +
      'gemini-2.5-flash:streamGenerateContent?key=' + encodeURIComponent(apiKey) + '&alt=sse';

    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
        generationConfig: { maxOutputTokens: 8192, temperature: 0.7 },
      }),
    });

    if (!response.ok) {
      let errMsg = 'Gemini API エラー: ' + response.status + ' ' + response.statusText;
      try {
        const errJson = await response.json();
        if (errJson?.error?.message) errMsg += ' — ' + errJson.error.message;
      } catch {}
      throw new Error(errMsg);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const jsonStr = trimmed.slice(5).trim();
        if (!jsonStr || jsonStr === '[DONE]') continue;
        try {
          const parsed = JSON.parse(jsonStr);
          const text = parsed?.candidates?.[0]?.content?.parts?.[0]?.text ?? '';
          if (text) yield text;
        } catch {}
      }
    }

    if (buffer.trim().startsWith('data:')) {
      const jsonStr = buffer.trim().slice(5).trim();
      if (jsonStr && jsonStr !== '[DONE]') {
        try {
          const parsed = JSON.parse(jsonStr);
          const text = parsed?.candidates?.[0]?.content?.parts?.[0]?.text ?? '';
          if (text) yield text;
        } catch {}
      }
    }
  }

        summaryEl.className = 'text-sm text-center text-violet-700 font-medium mb-2';
      } else {
        const missing = [];
        if (!hasKey) missing.push('APIキー');
        if (ideaCount === 0) missing.push('アイディア');
        if (featureCount === 0) missing.push('機能');
        summaryEl.textContent = missing.length ? missing.join('・') + 'を選択してください' : '';
        summaryEl.className = 'text-sm text-center text-gray-400 mb-2';
      }
    }
  }

  async function onGenerate() {
    if (AppState.isGenerating) return;
    const selectedIdeas = AppState.ideas.filter(i => AppState.selectedIdeaIds.has(i.index));
    const selectedFeatures = FILMORA_FEATURES.filter(f => AppState.selectedFeatureIds.has(f.id));
    if (!AppState.apiKey || selectedIdeas.length === 0 || selectedFeatures.length === 0) return;

    AppState.isGenerating = true;
    AppState.manualMarkdown = '';
    updateGenerateButton();

    const outputSection = document.getElementById('outputSection');
    const outputEl = document.getElementById('manualOutput');
    outputSection.classList.remove('hidden');
    outputEl.innerHTML = '<p class="text-violet-600 text-sm flex items-center gap-2"><span class="inline-block w-4 h-4 border-2 border-violet-400 border-t-transparent rounded-full animate-spin"></span>マニュアルを生成しています…</p>';

    function scrollToBottom() {
      if (window.innerWidth >= 1024) outputEl.scrollTop = outputEl.scrollHeight;
      else outputEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    let renderPending = false;
    function scheduleRender() {
      if (renderPending) return;
      renderPending = true;
      requestAnimationFrame(() => {
        outputEl.innerHTML = marked.parse(AppState.manualMarkdown);
        scrollToBottom();
        renderPending = false;
      });
    }

    const userPrompt = buildUserPrompt(selectedIdeas, selectedFeatures);
    outputEl.classList.add('streaming');

    try {
      for await (const chunk of streamGemini(AppState.apiKey, SYSTEM_PROMPT, userPrompt)) {
        AppState.manualMarkdown += chunk;
        scheduleRender();
      }
      outputEl.classList.remove('streaming');
      outputEl.innerHTML = marked.parse(AppState.manualMarkdown);
      scrollToBottom();
    } catch (err) {
      outputEl.classList.remove('streaming');
      outputEl.innerHTML = `
        <div class="flex items-start gap-2 p-3 bg-red-50 rounded-lg border border-red-200">
          <span class="text-red-500 text-lg">❌</span>
          <div>
            <p class="text-red-700 font-medium text-sm">生成エラー</p>
            <p class="text-red-600 text-xs mt-1">${escHtml(err.message)}</p>
          </div>
        </div>`;
    } finally {
      AppState.isGenerating = false;
      updateGenerateButton();
      document.getElementById('copyBtn').classList.remove('hidden');
      document.getElementById('downloadBtn').classList.remove('hidden');
    }
  }

  async function onCopy() {
    if (!AppState.manualMarkdown) return;
    try {
      await navigator.clipboard.writeText(AppState.manualMarkdown);
      const btn = document.getElementById('copyBtn');
      const original = btn.textContent;
      btn.textContent = '✅ コピー済み';
      setTimeout(() => { btn.textContent = original; }, 2000);
    } catch {
      alert('クリップボードへのコピーに失敗しました。');
    }
  }

  function onDownload() {
    if (!AppState.manualMarkdown) return;
    const date = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    const blob = new Blob([AppState.manualMarkdown], { type: 'text/markdown; charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'filmora-manual-' + date + '.md';
    a.click();
    URL.revokeObjectURL(url);
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // marked.js 設定
  marked.setOptions({ breaks: true, gfm: true });

  // デスクトップレイアウト：ヘッダー高さをCSS変数にセット
  function setHeaderHeight() {
    const h = document.getElementById('appHeader').offsetHeight;
    document.documentElement.style.setProperty('--header-h', h + 'px');
  }
  setHeaderHeight();
  window.addEventListener('resize', setHeaderHeight);
  </script>
</body>
</html>
