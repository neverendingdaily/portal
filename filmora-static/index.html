  // ═══════════════════════════════════════════════════════

  const firebaseConfig = {
    apiKey: "AIzaSyCJwQooL2MHQq2fg8aeXWGDD2s8VfzKZ04",
    authDomain: "portal-app-25359.firebaseapp.com",
    projectId: "portal-app-25359",
    storageBucket: "portal-app-25359.firebasestorage.app",
    messagingSenderId: "148295764653",
    appId: "1:148295764653:web:fe588512833f88852a9424",
    measurementId: "G-MLM10WJPGN"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();
  const historyCache = {};

  async function loadHistory() {
    const container = document.getElementById('historyContainer');
    try {
      const snapshot = await db.collection('filmora_manuals').orderBy('createdAt', 'desc').limit(20).get();
      if (snapshot.empty) {
        container.innerHTML = '<p class="text-xs text-center text-gray-400 py-4">履歴はありません</p>';
        return;
      }
      
      let html = '';
      snapshot.forEach(doc => {
        const data = doc.data();
        const date = data.createdAt ? data.createdAt.toDate().toLocaleString() : '最近';
        historyCache[doc.id] = data.content;
        html += `
          <div class="p-2 border border-gray-200 rounded-lg cursor-pointer hover:border-violet-400 hover:bg-violet-50 transition-all"
               onclick="restoreHistory('${doc.id}')">
            <p class="text-sm font-bold text-gray-800 truncate">生成マニュアル</p>
            <p class="text-[10px] text-gray-500 mt-0.5">💡${data.ideaCount}件 × ⚙️${data.featureCount}件<br>${date}</p>
          </div>
        `;
      });
      container.innerHTML = html;
    } catch(err) {
      console.error("履歴取得エラー:", err);
      container.innerHTML = '<p class="text-xs text-center text-red-400 py-4">履歴の取得に失敗しました</p>';
    }
  }

  function restoreHistory(id) {
    const content = historyCache[id];
    if(content) {
      AppState.manualMarkdown = content;
      const outputSection = document.getElementById('outputSection');
      const outputEl = document.getElementById('manualOutput');
      outputSection.classList.remove('hidden');
      outputEl.innerHTML = marked.parse(content);
      document.getElementById('copyBtn').classList.remove('hidden');
      document.getElementById('downloadBtn').classList.remove('hidden');
      if (window.innerWidth < 1024) outputEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  // ═══════════════════════════════════════════════════════
  // parser.js — AI抽出方式（あらゆる形式のテキストに対応）
  // ═══════════════════════════════════════════════════════

  function parseJsonSafe(rawText) {
    const cleaned = rawText.replace(/```json\s*/gi, '').replace(/```\s*/gi, '').trim();
    const match = cleaned.match(/\{[\s\S]*\}/);

    if (!match) {
      console.error('【parseJsonSafe】JSONが見つかりません。生レスポンス:', rawText);
      throw new Error('AIのレスポンスにJSONが含まれていませんでした。APIキーが正しいか、テキストに解析できる内容があるかご確認ください。');
    }

    const jsonString = match[0];

    try {
      return JSON.parse(jsonString);
    } catch (e) {
      const isTruncated = !jsonString.trimEnd().endsWith('}');
      console.error('【parseJsonSafe】JSONパース失敗。切断あり:', isTruncated, '\n抽出JSON:', jsonString);
      if (isTruncated) {
        throw new Error('AIの返答がトークン上限で途中切断されました。入力テキストを短くするか、アイディア数を減らしてから再試行してください。');
      }
      throw new Error('AIの返答をJSONとして解析できませんでした。再試行しても解決しない場合は、入力テキストを変えてお試しください。');
    }
  }

  async function parseIdeasMarkdown(text, apiKey) {
    if (!apiKey) {
      throw new Error('Gemini APIキーが設定されていません。ヘッダーのAPIキー欄に入力してから再度ファイルを選択してください。');
    }

    const prompt = `【絶対ルール・例外なし】
- 応答はJSON文字列のみ。前置き・後書き・挨拶・コードブロック記号（\`\`\`）は一切禁止。
- レスポンスの最初の文字は「{」、最後の文字は「}」でなければならない。
- 説明文・謝罪文・確認文を付けてはならない。JSONオブジェクトだけを出力すること。

以下のテキストからSNS投稿アイディアを最大6件抽出し、下記のJSONスキーマ形式のみで返せ。

【JSONスキーマ】
{
  "date": "テキスト内の日付をYYYYMMDD形式で（なければ空文字）",
  "rawDate": "同日付をYYYY-MM-DD形式で（なければ空文字）",
  "ideas": [
    {
      "index": 1,
      "genreNumber": "①〜⑥のような番号記号があれば（なければ空文字）",
      "genreLabel": "ジャンル・カテゴリ名",
      "title": "投稿テーマのタイトル（1文）",
      "format": "instagram-carousel または x-thread",

  async function* streamGemini(apiKey, systemPrompt, userPrompt) {
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:streamGenerateContent?key=' + encodeURIComponent(apiKey) + '&alt=sse';

    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
        generationConfig: { maxOutputTokens: 8192, temperature: 0.7 },
      }),
    });

    if (!response.ok) {
      let errMsg = 'Gemini API エラー: ' + response.status + ' ' + response.statusText;
      try {
        const errJson = await response.json();
        if (errJson?.error?.message) errMsg += ' — ' + errJson.error.message;
      } catch {}
      throw new Error(errMsg);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const jsonStr = trimmed.slice(5).trim();
        if (!jsonStr || jsonStr === '[DONE]') continue;
        try {
          const parsed = JSON.parse(jsonStr);
          const text = parsed?.candidates?.[0]?.content?.parts?.[0]?.text ?? '';
          if (text) yield text;
        } catch {}
      }
    }

    if (buffer.trim().startsWith('data:')) {
      const jsonStr = buffer.trim().slice(5).trim();
      if (jsonStr && jsonStr !== '[DONE]') {
        try {
          const parsed = JSON.parse(jsonStr);
          const text = parsed?.candidates?.[0]?.content?.parts?.[0]?.text ?? '';
          if (text) yield text;
        } catch {}
      }
    }
  }

    outputEl.classList.add('streaming');

    try {
      for await (const chunk of streamGemini(AppState.apiKey, SYSTEM_PROMPT, userPrompt)) {
        AppState.manualMarkdown += chunk;
        scheduleRender();
      }
      outputEl.classList.remove('streaming');
      outputEl.innerHTML = marked.parse(AppState.manualMarkdown);
      scrollToBottom();

      try {
        await db.collection('filmora_manuals').add({
          content: AppState.manualMarkdown,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          ideaCount: selectedIdeas.length > 0 ? selectedIdeas.length : 1,
          featureCount: selectedFeatures.length
        });
        loadHistory();
      } catch (err) {
        console.error("履歴保存エラー:", err);
      }

    } catch (err) {
      outputEl.classList.remove('streaming');
      outputEl.innerHTML = `
        <div class="flex items-start gap-2 p-3 bg-red-50 rounded-lg border border-red-200">
          <span class="text-red-500 text-lg">❌</span>
          <div>
            <p class="text-red-700 font-medium text-sm">生成エラー</p>
            <p class="text-red-600 text-xs mt-1">${escHtml(err.message)}</p>
          </div>
        </div>`;
    } finally {
      AppState.isGenerating = false;
      updateGenerateButton();
      document.getElementById('copyBtn').classList.remove('hidden');
      document.getElementById('downloadBtn').classList.remove('hidden');
    }
  }

  async function onCopy() {
    if (!AppState.manualMarkdown) return;
    try {
      await navigator.clipboard.writeText(AppState.manualMarkdown);
      const btn = document.getElementById('copyBtn');
      const original = btn.textContent;
      btn.textContent = '✅ コピー済み';
      setTimeout(() => { btn.textContent = original; }, 2000);
    } catch {
      alert('クリップボードへのコピーに失敗しました。');
    }
  }

  function onDownload() {
    if (!AppState.manualMarkdown) return;
    const date = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    const blob = new Blob([AppState.manualMarkdown], { type: 'text/markdown; charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'filmora-manual-' + date + '.md';
    a.click();
    URL.revokeObjectURL(url);
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  marked.setOptions({ breaks: true, gfm: true });

  function setHeaderHeight() {
    const h = document.getElementById('appHeader').offsetHeight;
    document.documentElement.style.setProperty('--header-h', h + 'px');
  }
  setHeaderHeight();
  window.addEventListener('resize', setHeaderHeight);
  </script>
</body>
</html>
