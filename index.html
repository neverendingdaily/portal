<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNS Marketing Portal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%%22 y=%2250%%22 style=%22dominant-baseline:central;text-anchor:middle;font-size:90px;%22>🚀</text></svg>">
    <style>
        :root{--bg-color:#fcfaf2;--card-bg:#fff;--card-hover:#fdfdf8;--text-main:#2c2925;--text-sub:#787168;--border-color:#ede8d9}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg-color);color:var(--text-main);margin:0;padding:2rem;display:flex;justify-content:center}
        .container{max-width:900px;width:100%}
        .header{display:flex;justify-content:center;align-items:center;margin-bottom:2rem}
        h1{font-size:1.8rem;margin:0;letter-spacing:.05em}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.5rem}
        .card{background:var(--card-bg);border-radius:12px;padding:1.5rem;text-decoration:none;color:var(--text-main);transition:all .2s ease;border:1px solid var(--border-color);display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(0,0,0,.02)}
        .card:hover{transform:translateY(-3px);border-color:#cbd5e1;box-shadow:0 10px 20px rgba(0,0,0,.06)}
        .icon-wrap{font-size:2rem;margin-bottom:1rem;line-height:1}
        .favicon-img{width:40px;height:40px;object-fit:contain;border-radius:6px}
        .title{font-size:1.1rem;font-weight:bold;margin-bottom:.5rem}
        .desc{font-size:.85rem;color:var(--text-sub);line-height:1.4}
        .badge{display:inline-block;padding:.2rem .5rem;border-radius:4px;font-size:.7rem;font-weight:bold;margin-bottom:1rem;width:fit-content}
        .bg-blue{background:#e0f2fe;color:#0369a1}.bg-green{background:#dcfce7;color:#15803d}.bg-purple{background:#f3e8ff;color:#7e22ce}.bg-orange{background:#ffedd5;color:#c2410c}.bg-gray{background:#f3f4f6;color:#4b5563}.bg-red{background:#fee2e2;color:#b91c1c}.bg-yellow{background:#fef9c3;color:#854d0e}.bg-teal{background:#ccfbf1;color:#0f766e}
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>🚀 Marketing System Portal</h1></div>
    <div class="grid" id="g"></div>
</div>
<script>

        "icon": "📝",
        "badgeClass": "bg-green",
        "badgeText": "Planning"
    },
    {
        "title": "Canva SNS Auto-Chef",
        "url": "https://neverendingdaily.github.io/canva/",
        "desc": "画像・動画構成とSOP・プロンプトをGeminiで全自動生成。",
        "icon": "🧑‍🍳",
        "badgeClass": "bg-orange",
        "badgeText": "Creative"
    },
    {
        "title": "Filmora AI Workflow Studio",
        "url": "https://neverendingdaily.github.io/fimora-ai-workflow-studio/",
        "desc": "アイデア → 台本 → プロンプト → SOP を一気通貫生成。",
        "icon": "🎬",

    },
    {

        "url": "https://neverendingdaily.github.io/postmesh-planner/",
        "desc": "予約ツールへのデータストックと流し込み成形。",

    },
    {

    },

    },
    {

        "badgeText": "Portal"
    },
    {
        "icon": "🍻",

    },
    {

        "desc": "10軸トンマナ分析 × 完全憑依生成。メディアの「声」を深層から解析し、完璧に再現する究極のゴーストライティングツール"
    },
    {

        "badgeClass": "bg-green",
        "title": "OCRテキスト抽出",

        "desc": ""
    },
    {
        "icon": "🎭",
        "badgeText": "Tool",
        "badgeClass": "bg-blue",
        "title": "トンマナ深層アナリスト",
        "url": "https://neverendingdaily.github.io/tonmana-tool/",
        "desc": ""
    }
];

function fav(u){
    try{
        return 'https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(new URL(u).hostname);
    }catch(e){
        return '';
    }
}

L.forEach(l => {
    const a = document.createElement('a');
    a.href = l.url;
    a.className = 'card';
    a.target = '_blank';
    
    const hasEmoji = l.icon && l.icon.trim() !== '';
    
    // テンプレートリテラル（バッククォート）を使ってクォーテーションの衝突を回避
    const ico = hasEmoji
        ? `<div class="icon-wrap">${l.icon}</div>`
        : `<div class="icon-wrap"><img class="favicon-img" src="${fav(l.url)}" alt="" onerror="this.style.display='none'"></div>`;
        
    a.innerHTML = `<span class="badge ${l.badgeClass}">${l.badgeText}</span>${ico}<div class="title">${l.title}</div><div class="desc">${l.desc}</div>`;
    document.getElementById('g').appendChild(a);
});
</script>
</body>
</html>
