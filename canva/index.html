<script>
    const STORAGE_KEY = 'canva_auto_chef_gemini_key';

    // ページ読み込み時にAPIキーを自動復元
    window.addEventListener('DOMContentLoaded', () => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            document.getElementById('apiKey').value = saved;
        }
    });

    function saveApiKey() {
        const key = document.getElementById('apiKey').value.trim();
        if (!key) { alert('APIキーを入力してから保存してください。'); return; }
        localStorage.setItem(STORAGE_KEY, key);
        const msg = document.getElementById('keySaveMsg');
        msg.classList.remove('hidden');
        setTimeout(() => msg.classList.add('hidden'), 3000);
    }

    function toggleKeyVisibility() {
        const input = document.getElementById('apiKey');
        const btn = document.getElementById('toggleKeyBtn');
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = '隠す';
        } else {
            input.type = 'password';
            btn.textContent = '表示';
        }
    }

    const SYSTEM_PROMPT = `あなたは「SNSデザイン戦略家 兼 Canva Pro制作ディレクター」です。
    ユーザーから入力されたSNS投稿の要件を分析し、以下の3つをJSON形式のみで出力してください。
    
    1. outline: スライド・画像の構成、見出し、内容設計、デザインアイデア
    2. sop: Canva Proの最短編集ステップ（使用機能・具体的手順・書き出し仕様）
    3. prompts: Magic Design用日本語プロンプト、Magic Media用英語プロンプト、イメージ解説
    
    【重要】JSONの値（value）は、ネストされたオブジェクトや配列にせず、必ず「改行（\\n）を含んだ1つの長い文字列（String）」として出力してください。
    【出力制限】JSONテキストのみ。コードブロック(\`\`\`json)・マークダウン・前置き文は一切不要。
    {"outline":"...","sop":"...","prompts":"..."}
    ライトモードのデザインを想定してください。`;
    
    let lastResult = {};
    let activeTabId = 'outline';
    
    function switchTab(id, btn) {
        document.querySelectorAll('.tab-pane').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('text-indigo-600', 'border-indigo-600');
                el.classList.add('text-gray-500', 'border-transparent');
        });
        document.getElementById(id).classList.remove('hidden');
        btn.classList.remove('text-gray-500', 'border-transparent');
        btn.classList.add('text-indigo-600', 'border-indigo-600');
        activeTabId = id;
    }
    
    function copyCurrentTab() {
        const txt = document.getElementById(activeTabId)?.innerText || '';
        navigator.clipboard.writeText(txt).then(showCopy);
    }
    
    function copyAll() {
        const all = ['outline','sop','prompts']
        .map(k => `=== ${k} ===\n` + (lastResult[k] || ''))
        .join('\n\n');
        navigator.clipboard.writeText(all).then(showCopy);
    }
    
    function showCopy() {
        const el = document.getElementById('copyMsg');
        el.classList.remove('hidden');
        setTimeout(() => el.classList.add('hidden'), 2000);
    }
    
    // 万が一オブジェクトで返ってきても強制的にテキスト化する安全装置
    function formatOutput(val) {
        if (!val) return '（生成されませんでした）';
        if (typeof val === 'string') return val;
        return JSON.stringify(val, null, 2); 
    }
    
    document.getElementById('generateBtn').addEventListener('click', async () => {
            const apiKey = document.getElementById('apiKey')?.value.trim();
            const platform = document.getElementById('platform').value;
            const text     = document.getElementById('inputText').value.trim();
            
            if (!apiKey) { alert('画面上部の「🔑 Gemini APIキー」を入力してください！'); return; }
            if (!text) { alert('投稿のアイデアを入力してください！'); return; }
            
            document.getElementById('generateBtn').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('placeholderArea').classList.add('hidden');
            document.getElementById('outputArea').classList.add('hidden');
            document.getElementById('errorBox').classList.add('hidden');
            
            try {
                const fullPrompt = `${SYSTEM_PROMPT}\n\nプラットフォーム：${platform}\n投稿アイデア：${text}`;
                
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                            contents: [{ parts: [{ text: fullPrompt }] }],
                            generationConfig: { responseMimeType: "application/json" }
                    })
            });
            
            if (!res.ok) {
                const e = await res.json();
                throw new Error(e.error?.message || `HTTP ${res.status}`);
            }
            
            const data = await res.json();
            const responseText = data.candidates[0].content.parts[0].text;
            
            const clean = responseText.replace(/```json\n?|```/g, '').trim();
            const result = JSON.parse(clean);
            
            // 安全装置を通してデータを格納
            lastResult = {
                outline: formatOutput(result.outline),
                sop: formatOutput(result.sop),
                prompts: formatOutput(result.prompts)
            };
            
            document.getElementById('outline').innerText  = lastResult.outline;
            document.getElementById('sop').innerText      = lastResult.sop;
            document.getElementById('prompts').innerText  = lastResult.prompts;
            
            switchTab('outline', document.getElementById('btn-outline'));
            document.getElementById('outputArea').classList.remove('hidden');
            
        } catch (err) {
            const box = document.getElementById('errorBox');
            box.innerText = '⚠️ エラー: APIキーが無効か、通信エラーです。\n詳細: ' + err.message;
            box.classList.remove('hidden');
            document.getElementById('placeholderArea').classList.remove('hidden');
        } finally {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('generateBtn').classList.remove('hidden');
        }
});
</script>

.__xwg_sub{ font-size:.65rem; font-weight:700; color:#8c8278; margin-top:8px; margin-bottom:5px; }
.__xwg_hr{ border:none; border-top:1px solid #ede8db; margin:8px 0; }
.__xwg_mi{ background:#fdf6e3; border:1.5px solid #f0d898; border-radius:7px; padding:9px 10px 9px 14px; margin-bottom:6px; position:relative; }
.__xwg_mi::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:#c47e10; border-radius:4px 0 0 4px; }
.__xwg_mi_ttl{ font-size:.78rem; font-weight:700; margin-bottom:3px; display:flex; justify-content:space-between; }
.__xwg_mi_body{ font-size:.74rem; line-height:1.6; white-space:pre-wrap; word-break:break-all; }
.__xwg_mi_date{ font-size:.62rem; color:#8c8278; margin-top:5px; }
.__xwg_empty{ text-align:center; padding:20px 10px; color:#8c8278; font-size:.76rem; }
.__xwg_empty .ei{ font-size:1.5rem; margin-bottom:5px; }
.__xwg_flash{ animation:__xwg_fl .6s ease; }
@keyframes __xwg_fl{ 40%{ background:#e8f5fa; border-color:#0e7ea4; } }
`;
const style = document.createElement('style');
style.textContent = _css;
document.head.appendChild(style);

/* ── ⑤ DOM構築 ── */
const anchor = document.getElementById('__xwg_anchor');
anchor.innerHTML = `
<button id="__xwg_btn" onclick="__xwgToggle()" title="メモ・ワード・履歴を開く">
  📌<span class="xwg-badge" id="__xwg_hbadge"></span>
</button>

<div id="__xwg_panel">
  <div class="__xwg_head">
    <span class="__xwg_logo">🗂️</span>
    <span class="__xwg_title">メモ・ワード・履歴</span>
    <button class="__xwg_close" onclick="__xwgClose()">✕</button>
  </div>
  <div class="__xwg_tabs">
    <button class="__xwg_tab on" onclick="__xwgTab('h',this)"><span class="ti">🕐</span>履歴</button>
    <button class="__xwg_tab"   onclick="__xwgTab('w',this)"><span class="ti">📌</span>ワード</button>
    <button class="__xwg_tab"   onclick="__xwgTab('m',this)"><span class="ti">📝</span>メモ</button>
  </div>
  <div class="__xwg_body">

    <div class="__xwg_pane on" id="__xwg_ph">
      <div class="__xwg_card">
        <div class="__xwg_card_title">🕐 ページ訪問履歴</div>
        <div id="__xwg_hlist"></div>
      </div>
      <div style="text-align:right;margin-top:4px;">
        <button class="__xwg_btn_s __xwg_btn_da" onclick="__xwgClearHist()">全削除</button>
      </div>
    </div>

    <div class="__xwg_pane" id="__xwg_pw">
      <div class="__xwg_card">
        <div class="__xwg_card_title">＋ ワードを登録</div>
        <input class="__xwg_inp" type="text" id="__xwg_nw" placeholder="ワード・フレーズ">
        <div class="__xwg_row">
          <select class="__xwg_sel" id="__xwg_nc">
            <option value="custom">🏷 カスタム</option>
            <option value="pain">😤 ペイン</option>
            <option value="benefit">✨ ベネフィット</option>
            <option value="account">👤 アカウント</option>
          </select>
          <input class="__xwg_inp" type="text" id="__xwg_nl" placeholder="ラベル名">
        </div>
        <button class="__xwg_btn_s __xwg_btn_co __xwg_full" onclick="__xwgRegWord()">＋ 登録する</button>
      </div>
      <div class="__xwg_card">
        <div class="__xwg_card_title">登録済みワード</div>
        <div id="__xwg_wtags"></div>
      </div>
    </div>

    <div class="__xwg_pane" id="__xwg_pm">
      <div class="__xwg_card">
        <div class="__xwg_card_title">📝 メモを追加</div>
        <input class="__xwg_inp" type="text" id="__xwg_mt" placeholder="タイトル">
        <textarea class="__xwg_inp ta" id="__xwg_mb" placeholder="本文…" style="margin-top:5px;"></textarea>
        <button class="__xwg_btn_s __xwg_btn_am __xwg_full" onclick="__xwgAddMemo()">保存</button>
      </div>
      <div class="__xwg_card">
        <div class="__xwg_card_title">メモ一覧</div>
        <div id="__xwg_mlist"></div>
      </div>
    </div>

  </div>
</div>
`;

/* ── ⑥ UIロジック ── */
let __xwg_open = false;

window.__xwgToggle = () => {
  __xwg_open = !__xwg_open;
  const panel = document.getElementById('__xwg_panel');
  if(__xwg_open){
    panel.classList.add('open');
    window.__xwgRenderAll();
  } else {
    panel.classList.remove('open');
  }
};
window.__xwgClose = () => {
  __xwg_open = false; document.getElementById('__xwg_panel').classList.remove('open');
};
window.__xwgTab = (id, btn) => {
  document.querySelectorAll('.__xwg_pane').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.__xwg_tab').forEach(t=>t.classList.remove('on'));
  document.getElementById({h:'__xwg_ph',w:'__xwg_pw',m:'__xwg_pm'}[id]).classList.add('on');
  btn.classList.add('on');
  window.__xwgRenderAll();
};

window.__xwgRenderAll = () => {
  if(!__xwg_open) return;
  __xwgRenderHist(); __xwgRenderWords(); __xwgRenderMemos();
};

function __xwgRenderHist(){
  const list = _ld(XWG_KEYS.history, []);
  const el = document.getElementById('__xwg_hlist');
  if(!list.length) return el.innerHTML = '<div class="__xwg_empty"><div class="ei">🕐</div>履歴がありません</div>';
  el.innerHTML = list.map((h,i) => `
    <div class="__xwg_hi">
      <div class="__xwg_hi_title">${_esc(h.title || '(タイトルなし)')}</div>
      <div class="__xwg_hi_url">${_esc(h.url)}</div>
      <div class="__xwg_hi_meta">
        <span class="__xwg_hi_date">${_fmt(h.ts)}</span>
        <div class="__xwg_hi_btns">
          <button class="__xwg_hbtn __xwg_hbtn_go" onclick="window.open('${_ea(h.url)}','_blank')">開く</button>
          <button class="__xwg_hbtn __xwg_hbtn_cp" onclick="__xwgCopy('${_ea(h.url)}',this)">コピー</button>
          <button class="__xwg_hbtn __xwg_hbtn_dl" onclick="__xwgDelHist(${i})">✕</button>
        </div>
      </div>
    </div>`).join('');
}
window.__xwgDelHist = (i) => { const l=_ld(XWG_KEYS.history,[]); l.splice(i,1); _sv(XWG_KEYS.history, l); };
window.__xwgClearHist = () => { if(confirm('全削除しますか？')) _sv(XWG_KEYS.history, []); };

window.__xwgRegWord = () => {
  const word = document.getElementById('__xwg_nw').value.trim();
  const cat  = document.getElementById('__xwg_nc').value;
  const label = document.getElementById('__xwg_nl').value.trim() || word;
  if(!word) return alert('ワードを入力してください。');
  const words = _ld(XWG_KEYS.words, []);
  words.push({id: Date.now(), word, cat, label, ts: Date.now()});
  _sv(XWG_KEYS.words, words);
  document.getElementById('__xwg_nw').value = ''; document.getElementById('__xwg_nl').value = '';
};
window.__xwgDelWord = (id) => _sv(XWG_KEYS.words, _ld(XWG_KEYS.words,[]).filter(w=>w.id!==id));

function __xwgRenderWords(){
  const words = _ld(XWG_KEYS.words, []);
  const el = document.getElementById('__xwg_wtags');
  if(!words.length) return el.innerHTML = '<div class="__xwg_empty"><div class="ei">📌</div>登録がありません</div>';
  const cats = ['pain','benefit','custom','account'];
  const labels = {pain:'😤 ペイン',benefit:'✨ ベネフィット',custom:'🏷 カスタム',account:'👤 アカウント'};
  let html = '';
  cats.forEach(cat => {
    const cw = words.filter(w=>w.cat===cat);
    if(!cw.length) return;
    html += `<div class="__xwg_sub">${labels[cat]}</div><div class="__xwg_tags">` + cw.map(w=>`
      <span class="__xwg_tag ${w.cat}" title="${_esc(w.word)}" onclick="__xwgCopy('${_ea(w.word)}',this)">
        <span class="tl">${_esc(w.label)}</span>
        <span class="td" onclick="event.stopPropagation();__xwgDelWord(${w.id})">✕</span>
      </span>`).join('') + `</div><div class="__xwg_hr"></div>`;
  });
  el.innerHTML = html;
}

window.__xwgAddMemo = () => {
  const title = document.getElementById('__xwg_mt').value.trim();
  const body  = document.getElementById('__xwg_mb').value.trim();
  if(!title && !body) return;
  const memos = _ld(XWG_KEYS.memos, []);
  memos.unshift({id:Date.now(), title:title||'（無題）', body, ts:Date.now()});
  _sv(XWG_KEYS.memos, memos);
  document.getElementById('__xwg_mt').value = ''; document.getElementById('__xwg_mb').value = '';
};
window.__xwgDelMemo = (id) => _sv(XWG_KEYS.memos, _ld(XWG_KEYS.memos,[]).filter(m=>m.id!==id));

function __xwgRenderMemos(){
  const memos = _ld(XWG_KEYS.memos, []);
  const el = document.getElementById('__xwg_mlist');
  if(!memos.length) return el.innerHTML = '<div class="__xwg_empty"><div class="ei">📝</div>メモがありません</div>';
  el.innerHTML = memos.map(m=>`
    <div class="__xwg_mi">
      <div class="__xwg_mi_ttl"><span>${_esc(m.title)}</span>
        <button class="__xwg_hbtn __xwg_hbtn_dl" onclick="__xwgDelMemo(${m.id})">✕</button>
      </div>
      <div class="__xwg_mi_body">${_esc(m.body)}</div>
      <div class="__xwg_mi_date">${_fmt(m.ts)}</div>
    </div>`).join('');
}

window.__xwgCopy = (text, el) => {
  navigator.clipboard.writeText(text).then(()=>{
    if(el){ el.classList.add('__xwg_flash'); setTimeout(()=>el.classList.remove('__xwg_flash'),700); }
  });
};

function __xwgUpdateBadge(){
  const n = _ld(XWG_KEYS.history, []).length;
  const b = document.getElementById('__xwg_hbadge');
  if(n > 0){ b.style.display='flex'; b.textContent = n > 99 ? '99+' : n; } else { b.style.display='none'; }
}

/* ── ⑦ Firebaseからのリアルタイム同期 ── */
let isFirstLoad = true;

onSnapshot(docRef, (snapshot) => {
  if(snapshot.exists()) {
    __xwgState = { ...__xwgState, ...snapshot.data() };
  }

  if(isFirstLoad) {
    isFirstLoad = false;
    if(XWG_AUTO_HIST) {
      const entry = { url: location.href, title: document.title, ts: Date.now() };
      const hist = _ld(XWG_KEYS.history, []);
      if(!hist.length || hist[0].url !== entry.url){
        hist.unshift(entry);
        if(hist.length > XWG_MAX_HIST) hist.pop();
        _sv(XWG_KEYS.history, hist);
      }
    }
  }

  window.__xwgRenderAll();
  __xwgUpdateBadge();
});

</script>
</body>
</html>
