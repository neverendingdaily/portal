<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Serif+Display&display=swap');

  :root {
    --bg: #F7F6F3;
    --surface: #FFFFFF;
    --border: #E5E2DC;
    --text: #1A1A1A;
    --text-muted: #6B6860;
    --accent: #2D2D2D;
    --c1-bg: #FFFBEB; --c1-bd: #F59E0B; --c1-lbl: #92400E;
    --c2-bg: #F0FDF4; --c2-bd: #22C55E; --c2-lbl: #14532D;
    --c3-bg: #EFF6FF; --c3-bd: #3B82F6; --c3-lbl: #1E3A8A;
    --c4-bg: #FFF1F2; --c4-bd: #F43F5E; --c4-lbl: #881337;
    --c5-bg: #FDF4FF; --c5-bd: #A855F7; --c5-lbl: #581C87;
    --c6-bg: #F0FDFA; --c6-bd: #14B8A6; --c6-lbl: #134E4A;
    --c7-bg: #FFF7ED; --c7-bd: #F97316; --c7-lbl: #7C2D12;
    --c8-bg: #F8FAFC; --c8-bd: #94A3B8; --c8-lbl: #1E293B;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    font-size: 14px;
    line-height: 1.7;
  }

  /* ========== DROP ZONE ========== */
  #dropzone {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg);
    z-index: 100;
    transition: opacity 0.4s;
  }
  #dropzone.hidden { opacity: 0; pointer-events: none; }
  .drop-inner {
    border: 2.5px dashed #C8C4BC;
    border-radius: 20px;
    padding: 50px 70px;
    text-align: center;
    background: white;
    cursor: pointer;
    transition: all 0.2s;
    max-width: 580px;
    width: 90%;
  }
  .drop-inner:hover, .drop-inner.drag-over {
    border-color: var(--accent);
    background: #FAFAF8;
    transform: scale(1.01);
  }
  .drop-icon { font-size: 48px; margin-bottom: 14px; }
  .drop-title {

    <div class="file-types">
      <span class="file-type-badge md">📄 .md</span>

      <button class="topbar-reset" onclick="resetApp()">＋ ファイル追加・リセット</button>
    </div>
  </div>

  <div id="mainPanels" style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;"></div>

<script>
// ==========================================
// PDF.js setup
// ==========================================
if (typeof pdfjsLib !== 'undefined') {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

// ==========================================
// SECTION CONFIG
// ==========================================
const SECTION_CONFIG = [
  { key:'title',     label:'📌 テーマ',       tab:'tab-title',     panel:'sec-title'    },
  { key:'source',    label:'📰 出典',          tab:'tab-source',    panel:'sec-source'   },
  { key:'persona',   label:'👤 ペルソナ',      tab:'tab-persona',   panel:'sec-persona'  },
  { key:'strategy',  label:'💰 戦略',          tab:'tab-strategy',  panel:'sec-strategy' },
  { key:'twitter',   label:'🐦 X投稿',         tab:'tab-twitter',   panel:'sec-twitter'  },
  { key:'instagram', label:'📸 Instagram',     tab:'tab-instagram', panel:'sec-instagram'},
  { key:'threads',   label:'🧵 Threads',       tab:'tab-threads',   panel:'sec-threads'  },
  { key:'blog',      label:'📝 ブログ',        tab:'tab-blog',      panel:'sec-blog'     },
  { key:'tools',     label:'🔧 ツール',        tab:'tab-tools',     panel:'sec-tools'    },
];

const SECTION_KEY_MAP = {
  '1':'title','2':'source','3':'persona','4':'strategy',
  '5':'twitter','6':'instagram','7':'threads','8':'blog','9':'tools'
};

// ==========================================
// PARSER
// ==========================================
function parseMarkdown(text, filename, fileType) {
  const lines = text.split('\n');
  const result = { genre:'', filename, fileType, themes:[], isParsed: false };
  let currentTheme = null;
  let currentSectionKey = null;
  let currentContent = [];

  function flushSection() {
    if (currentTheme && currentSectionKey) {
      currentTheme.sections[currentSectionKey] = currentContent.join('\n').trim();
    }
    currentContent = [];
  }

  for (const line of lines) {
    if (/^##\s/.test(line) && !/^###/.test(line)) {
      result.genre = line.replace(/^##\s*/, '').trim();
      continue;
    }
    if (/^###\s/.test(line)) {
      flushSection(); currentSectionKey = null;
      currentTheme = { heading: line.replace(/^###\s*/, '').trim(), sections:{} };
      result.themes.push(currentTheme);
      continue;
    }
    if (/^####\s/.test(line)) {
      flushSection();
      const m = line.match(/^####\s*(\d+)\./);
      currentSectionKey = m ? (SECTION_KEY_MAP[m[1]] || null) : null;
      continue;
    }
    if (currentSectionKey) currentContent.push(line);
  }
  flushSection();

  if (result.themes.length > 0) result.isParsed = true;
  if (!result.genre) result.genre = filename.replace(/\.[^.]+$/, '');
  return result;
}

// ==========================================
// MARKDOWN → HTML
// ==========================================
function escH(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function inline(t){
  return t
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>');
}

function renderMd(md) {
  if (!md) return '<em style="color:#999">（内容なし）</em>';
  const lines = md.split('\n');
  let html = '', inUl = false, ulDepth = 0;
  for (const line of lines) {
    const bm = line.match(/^(\s*)[-*]\s(.+)/);
    if (bm) {
      const depth = Math.floor(bm[1].length / 4) + 1;
      if (!inUl){ html+='<ul>'; inUl=true; ulDepth=1; }
      if (depth > ulDepth){ for(let d=ulDepth;d<depth;d++) html+='<ul>'; ulDepth=depth; }
      else if(depth < ulDepth){ for(let d=ulDepth;d>depth;d--) html+='</ul>'; ulDepth=depth; }
      html += `<li>${inline(bm[2])}</li>`;
      continue;
    }
    if(inUl && line.trim()){
      for(let d=ulDepth;d>0;d--) html+='</ul>'; inUl=false; ulDepth=0;
    }
    if(!line.trim()){ if(inUl){for(let d=ulDepth;d>0;d--) html+='</ul>'; inUl=false; ulDepth=0;} continue; }
    html += `<p>${inline(line.trim())}</p>`;
  }
  if(inUl) for(let d=ulDepth;d>0;d--) html+='</ul>';
  return html;
}

function renderX(md) {
  const patterns = [];
  let current = null;
  for (const line of md.split('\n')) {
    const pm = line.match(/[-*]\s*\*\*パターン([A-Z])[：:]/);
    if (pm){ if(current) patterns.push(current); current={ label:`パターン${pm[1]}`, text:'' }; continue; }
    if (current) current.text += line + '\n';
  }
  if(current) patterns.push(current);
  let html = '';
  for(const p of patterns){
    const t = p.text.replace(/^\s+|\s+$/g,'').replace(/\*\*(.+?)\*\*/g,'$1');
    html += `<div class="pattern-label">${p.label}</div>
    <div class="x-pattern">${escH(t)}</div>
    <button class="copy-btn" onclick="doCopy(this,${JSON.stringify(t)})">📋 コピー</button>`;
  }
  if(!patterns.length){
    const t = md.replace(/\*\*(.+?)\*\*/g,'$1').trim();
    html += `<div class="x-pattern">${escH(t)}</div>
    <button class="copy-btn" onclick="doCopy(this,${JSON.stringify(t)})">📋 コピー</button>`;
  }
  const tags = [...new Set(md.match(/#[\w\u3040-\u9FFF]+/g)||[])];
  if(tags.length) html += '<div class="hashtag-area">'+tags.map(t=>`<span class="hashtag">${t}</span>`).join('')+'</div>';
  return html;
}

function renderPost(md, cls){
  const t = md.replace(/\*\*(.+?)\*\*/g,'$1').trim();
  const tags = [...new Set(md.match(/#[\w\u3040-\u9FFF]+/g)||[])];
  let html = `<button class="copy-btn" onclick="doCopy(this,${JSON.stringify(t)})">📋 全文コピー</button>
  <div class="post-block ${cls}">${escH(t)}</div>`;
  if(tags.length) html += '<div class="hashtag-area">'+tags.map(t=>`<span class="hashtag">${t}</span>`).join('')+'</div>';
  return html;
}

function renderTools(md){
  const parts = md.split(/```/);
  let html='';
  for(let i=0;i<parts.length;i++){
    if(i%2===0) html+=renderMd(parts[i]);
    else{
      const c=parts[i].trim();
      html+=`<button class="copy-btn" onclick="doCopy(this,${JSON.stringify(c)})">📋 プロンプトコピー</button>
      <div class="prompt-block">${escH(c)}</div>`;
    }
  }
  return html;
}

// ==========================================
// FILE READERS
// ==========================================
async function readTextFile(file) {
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result);
    r.onerror=rej;
    r.readAsText(file,'UTF-8');
  });
}

async function readPDF(file) {
  if (typeof pdfjsLib === 'undefined') throw new Error('PDF.jsが読み込めませんでした');
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let fullText = '';
  for (let i=1; i<=pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const pageText = content.items.map(item => item.str).join(' ');
    fullText += pageText + '\n';
  }
  return fullText;
}

function getFileType(filename){
  const ext = filename.split('.').pop().toLowerCase();
  return ext;
}

// ==========================================
// MAIN DATA + RENDER
// ==========================================
let allData = [];

async function loadFiles(files) {
  showProgress(true, '読み込み準備中...');
  allData = [];

  for (const file of files) {
    const ftype = getFileType(file.name);
    showProgress(true, `読み込み中: ${file.name}`);
    try {
      let text = '';
      if (ftype === 'pdf') {
        text = await readPDF(file);
      } else {
        text = await readTextFile(file);
      }
      const data = parseMarkdown(text, file.name, ftype);
      allData.push(data);
    } catch(e) {
      console.error('Failed to load:', file.name, e);
      allData.push({
        genre: file.name, filename: file.name, fileType: getFileType(file.name),
        themes: [], isParsed: false, rawText: '読み込みエラー: ' + e.message
      });
    }
  }

  showProgress(false);
  if (allData.length === 0) { alert('ファイルが読み込めませんでした。'); return; }
  renderApp();
  document.getElementById('dropzone').classList.add('hidden');
  document.getElementById('app').classList.add('visible');
}

function showProgress(show, msg='') {
  const el = document.getElementById('progress');
  el.classList.toggle('show', show);
  if(msg) document.getElementById('progressText').textContent = msg;
}

function renderApp() {
  const tabs = document.getElementById('genreTabs');
  const panels = document.getElementById('mainPanels');
  const meta = document.getElementById('topbarMeta');

  const totalThemes = allData.reduce((s,d)=>s+d.themes.length,0);
  meta.textContent = `${allData.length}ファイル・${totalThemes}テーマ`;

  tabs.innerHTML = '';
  panels.innerHTML = '';

  allData.forEach((data, gi) => {
    // TAB
    const tab = document.createElement('div');
    tab.className = 'genre-tab' + (gi===0?' active':'');
    const pillClass = data.fileType==='pdf'?'pill-pdf':data.fileType==='txt'?'pill-txt':'pill-md';
    const pillLabel = data.fileType==='pdf'?'PDF':data.fileType==='txt'?'TXT':'MD';
    tab.innerHTML = `<span class="file-type-pill ${pillClass}">${pillLabel}</span>${escH(data.genre)} <span class="genre-count">${data.themes.length}</span>`;
    tab.onclick = () => switchGenre(gi);
    tabs.appendChild(tab);

    // PANEL
    const panel = document.createElement('div');
    panel.className = 'main' + (gi===0?' active':'');
    panel.id = `genre-panel-${gi}`;

    if (!data.isParsed) {
      // Not parsed - show raw text
      const rawDisplay = data.rawText || '（内容を解析できませんでした。MD/TXT形式のファイルの場合は、### と #### の見出し構造が必要です）';
      panel.innerHTML = `
        <div class="summary-bar">
          <span>📂 <strong>${escH(data.filename)}</strong></span>
          <span class="file-type-pill ${pillClass}">${pillLabel}</span>
          <span style="color:#f59e0b;">⚠️ 構造化形式で解析できませんでした。生テキストで表示します。</span>
        </div>
        <div class="raw-text-block">${escH(rawDisplay.slice(0, 20000))}</div>
      `;
    } else {
      let html = `
        <div class="search-wrap">
          <input class="search-input" type="text" placeholder="🔍 このジャンル内を検索..." oninput="filterThemes(${gi}, this.value)">
        </div>
        <div class="summary-bar">
          <span>📂 <strong>${escH(data.filename)}</strong></span>
          <span class="file-type-pill ${pillClass}">${pillLabel}</span>
          <span>テーマ数: <strong>${data.themes.length}件</strong></span>
        </div>
        <div id="themes-${gi}">
      `;
      data.themes.forEach((theme, ti) => { html += buildThemeCard(theme, ti, gi); });
      html += '</div>';
      panel.innerHTML = html;
    }

    panels.appendChild(panel);
  });
}

function buildThemeCard(theme, ti, gi) {
  const id = `t-${gi}-${ti}`;
  let tabsHtml = '<div class="section-tabs">';
  let panelsHtml = '<div class="section-panels">';
  let firstSet = false;

  for (const sec of SECTION_CONFIG) {
    const content = theme.sections[sec.key] || '';
    if (!content) continue;
    const isFirst = !firstSet; firstSet = true;
    tabsHtml += `<div class="sec-tab ${sec.tab}${isFirst?' active':''}" onclick="switchSec('${id}','${sec.key}',this)">${sec.label}</div>`;

    let rendered = '';
    if      (sec.key==='twitter')   rendered = renderX(content);
    else if (sec.key==='instagram') rendered = renderPost(content,'ig');
    else if (sec.key==='threads')   rendered = renderPost(content,'th');
    else if (sec.key==='tools')     rendered = renderTools(content);
    else                            rendered = renderMd(content);

    panelsHtml += `<div class="section-panel ${sec.panel}${isFirst?' active':''}" id="${id}-${sec.key}">${rendered}</div>`;
  }
  tabsHtml += '</div>';
  panelsHtml += '</div>';

  return `
    <div class="theme-card" id="${id}" data-title="${escH(theme.heading)}">
      <div class="theme-header" onclick="toggleTheme('${id}')">
        <span class="theme-num">${ti+1}</span>
        <span class="theme-title-text">${escH(theme.heading)}</span>
        <span class="theme-toggle">▼</span>
      </div>
      <div class="theme-body">${tabsHtml}${panelsHtml}</div>
    </div>`;
}

// ==========================================
// INTERACTIONS
// ==========================================
function switchGenre(gi) {
  document.querySelectorAll('.genre-tab').forEach((t,i)=>t.classList.toggle('active',i===gi));
  document.querySelectorAll('.main').forEach((p,i)=>p.classList.toggle('active',i===gi));
}

function toggleTheme(id) {
  document.getElementById(id).classList.toggle('open');
}

function switchSec(themeId, key, tab) {
  const card = document.getElementById(themeId);
  card.querySelectorAll('.sec-tab').forEach(t=>t.classList.remove('active'));
  card.querySelectorAll('.section-panel').forEach(p=>p.classList.remove('active'));
  tab.classList.add('active');
  const p = document.getElementById(`${themeId}-${key}`);
  if(p) p.classList.add('active');
}

function filterThemes(gi, q) {
  const ql = q.toLowerCase();
  document.getElementById(`themes-${gi}`).querySelectorAll('.theme-card').forEach(c=>{
    c.style.display = (!ql || c.dataset.title.toLowerCase().includes(ql)) ? '' : 'none';
  });
}

async function doCopy(btn, text) {
  try {
    await navigator.clipboard.writeText(text);
    const orig = btn.innerHTML;
    btn.innerHTML = '✅ コピーしました！';
    btn.classList.add('copied');
    setTimeout(()=>{ btn.innerHTML=orig; btn.classList.remove('copied'); }, 2000);
  } catch(e) { alert('コピーできませんでした。'); }
}

function resetApp() {
  allData = [];
  document.getElementById('app').classList.remove('visible');
  document.getElementById('dropzone').classList.remove('hidden');
  document.getElementById('fileInput').value = '';
  document.getElementById('genreTabs').innerHTML = '';
  document.getElementById('mainPanels').innerHTML = '';
}

// ==========================================
// DROP / FILE INPUT
// ==========================================
document.getElementById('fileInput').addEventListener('change', e=>{
  if(e.target.files.length) loadFiles([...e.target.files]);
});

const dropzone = document.getElementById('dropzone');
const dropInner = document.getElementById('dropInner');

dropzone.addEventListener('dragover', e=>{ e.preventDefault(); dropInner.classList.add('drag-over'); });
dropzone.addEventListener('dragleave', ()=>dropInner.classList.remove('drag-over'));
dropzone.addEventListener('drop', e=>{
  e.preventDefault(); dropInner.classList.remove('drag-over');
  const files = [...e.dataTransfer.files].filter(f=>/\.(md|txt|pdf)$/i.test(f.name));
  if(files.length) loadFiles(files);
  else alert('.md / .txt / .pdf ファイルをドロップしてください。');
});
</script>
