    <style>
        /* ライトモード専用のCSS定義 */
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --sidebar-bg: #f4f4f4;
            --border-color: #cccccc;
            --btn-bg: #e0e0e0;
            --btn-hover: #d0d0d0;
        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* サイドバー */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
        }

        .search-bar {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .history-list li {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 14px;
        }

        .history-list li:hover {
            background-color: var(--btn-hover);
        }

        /* メインエリア */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--btn-bg);
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        .title-input {
            font-size: 24px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: transparent;
            color: var(--text-color);
        }

        .text-area {
            flex-grow: 1;
            font-size: 16px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            resize: none;
            background-color: transparent;
            color: var(--text-color);
            font-family: inherit;
            line-height: 1.6;
        }

        .text-area:focus, .title-input:focus {
            outline: none;
            border-color: #888;
        }

        .status-bar {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <input type="text" class="search-bar" placeholder="ノートを検索... (未実装)">
        <ul class="history-list">
            <li>過去のノート 1 (ダミー)</li>
            <li>過去のノート 2 (ダミー)</li>
        </ul>
    </div>

    <div class="main-content">
        <div class="toolbar">
            <button id="btn-save">💾 保存 (Firebase用)</button>
            <button id="btn-copy">📋 コピー</button>
            <button id="btn-download">⬇️ .txt ダウンロード</button>
            <button id="btn-clear">🗑️ クリア</button>
            <button id="btn-share">🔗 共有 (未実装)</button>
            </div>

        <input type="text" id="note-title" class="title-input" placeholder="タイトルを入力...">
        <textarea id="note-content" class="text-area" placeholder="ここにテキストを入力...（自動保存されます）"></textarea>

        <div class="status-bar">
            文字数: <span id="char-count">0</span> | 行数: <span id="line-count">0</span>
        </div>
    </div>

    <script>
        const titleInput = document.getElementById('note-title');
        const contentArea = document.getElementById('note-content');
        const charCount = document.getElementById('char-count');
        const lineCount = document.getElementById('line-count');
        
        window.addEventListener('load', () => {
            if (localStorage.getItem('draft_title')) {
                titleInput.value = localStorage.getItem('draft_title');
            }
            if (localStorage.getItem('draft_content')) {
                contentArea.value = localStorage.getItem('draft_content');
            }
            updateCounters();
        });

        const autoSaveAndCount = () => {
            localStorage.setItem('draft_title', titleInput.value);
            localStorage.setItem('draft_content', contentArea.value);
            updateCounters();
        };

        titleInput.addEventListener('input', autoSaveAndCount);
        contentArea.addEventListener('input', autoSaveAndCount);

        function updateCounters() {
            const text = contentArea.value;
            charCount.textContent = text.length;
            
            if (text.length === 0) {
                lineCount.textContent = 0;
            } else {
                lineCount.textContent = text.split('\n').length;
            }
        }

        document.getElementById('btn-copy').addEventListener('click', () => {
            contentArea.select();
            navigator.clipboard.writeText(contentArea.value)
                .then(() => alert('テキストをコピーしました！'))
                .catch(err => alert('コピーに失敗しました: ' + err));
        });

        document.getElementById('btn-download').addEventListener('click', () => {
            const text = contentArea.value;
            const title = titleInput.value || 'untitled';
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `${title}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            if (confirm('内容をすべて消去しますか？（この操作は元に戻せません）')) {
                titleInput.value = '';
                contentArea.value = '';
                localStorage.removeItem('draft_title');
                localStorage.removeItem('draft_content');
                updateCounters();
            }
        });
    </script>
</body>
</html>
