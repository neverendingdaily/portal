    <style>
        /* CSS変数の定義（くすみピンク・ニュアンスカラー） */
        :root {
            --bg-color: #fcf8f8;          /* ほんのりピンクがかった明るい背景 */
            --text-color: #4a4040;        /* 黒ではなく、温かみのあるアッシュブラウン */
            --sidebar-bg: #f4ecec;        /* 背景に馴染む、少しくすんだピンクベージュ */
            --border-color: #e2d3d3;      /* 境界線も優しいココアグレー */
            --btn-bg: #eddcdc;            /* 落ち着いたトーンのくすみピンク */
            --btn-hover: #fcf1f1;         /* ホバー時はふんわりと明るく白に近づく */
            --shadow-color: rgba(160, 140, 140, 0.15);
        }

        body.dark-mode {
            --bg-color: #2b2424;          /* 赤みを含んだ深いダークブラウン */
            --text-color: #e8dede;        /* 目に優しいくすみホワイト */
            --sidebar-bg: #211b1b;        /* さらに深いトーンの背景 */
            --border-color: #473c3c;      /* 馴染みの良いダークココア */
            --btn-bg: #403535;            /* 暗めのくすみピンクブラウン */
            --btn-hover: #594b4b;         /* ホバー時はふんわりと明るいブラウンに */
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        /* サイドバー */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }

        .search-bar {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 14px;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .history-list li {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 14px;
            border-radius: 4px;
            transition: background-color 0.3s ease; /* ホバーエフェクトをなめらかに */
        }

        .history-list li:hover {
            background-color: var(--btn-hover);
        }

        /* メインエリア */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 25px;
            box-sizing: border-box;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--btn-bg);
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 2px 4px var(--shadow-color);
            /* ふんわりと変化させるためのグラデーション・遷移設定 */
            transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        }

        button:hover {
            background-color: var(--btn-hover); /* 色をふんわり明るく */
            border-color: #c4b2b2; /* 枠線も少しだけ明度を調整 */
            box-shadow: 0 4px 8px var(--shadow-color); /* 少し浮き上がるエフェクト */
        }
        
        body.dark-mode button:hover {
            border-color: #6e5d5d;
        }

        .title-input {
            font-size: 24px;
            font-weight: bold;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid transparent;
            border-bottom: 2px solid var(--border-color);
            background-color: transparent;
            color: var(--text-color);
            transition: border-color 0.3s;
        }

        .text-area {
            flex-grow: 1;
            font-size: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: none;
            background-color: transparent;
            color: var(--text-color);
            font-family: inherit;
            line-height: 1.7;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
            transition: border-color 0.3s;
        }

        .text-area:focus, .title-input:focus {
            outline: none;
            border-color: #a69292;
        }
        
        body.dark-mode .text-area:focus, body.dark-mode .title-input:focus {
            border-color: #8c7676;
        }

        .status-bar {
            margin-top: 12px;
            font-size: 13px;
            color: #9c8c8c;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <input type="text" class="search-bar" placeholder="ノートを検索... (未実装)">
        <ul class="history-list" id="historyList">
            <li style="color: #9c8c8c; text-align: center;">読み込み中...</li>
        </ul>
    </div>

    <div class="main-content">
        <div class="toolbar">
            <button id="btn-save" onclick="saveToFirebase()">💾 保存 (クラウド)</button>
            <button id="btn-copy">📋 コピー</button>
            <button id="btn-download">⬇️ .txt ダウンロード</button>
            <button id="btn-clear">🗑️ クリア</button>
            <button id="btn-share">🔗 共有 (未実装)</button>
            <button id="btn-darkmode">🌙 ダークモード切替</button>
        </div>

        <input type="text" id="note-title" class="title-input" placeholder="タイトルを入力...">
        <textarea id="note-content" class="text-area" placeholder="ここにテキストを入力...（自動保存されます）"></textarea>

        <div class="status-bar">
            文字数: <span id="char-count">0</span> | 行数: <span id="line-count">0</span>
        </div>
    </div>

    <script>
        // DOM要素の取得
        const titleInput = document.getElementById('note-title');
        const contentArea = document.getElementById('note-content');
        const charCount = document.getElementById('char-count');
        const lineCount = document.getElementById('line-count');
        const darkModeBtn = document.getElementById('btn-darkmode');
        
        // --- 1. 自動保存と読み込み (LocalStorage) ---
        window.addEventListener('load', () => {
            if (localStorage.getItem('draft_title')) {
                titleInput.value = localStorage.getItem('draft_title');
            }
            if (localStorage.getItem('draft_content')) {
                contentArea.value = localStorage.getItem('draft_content');
            }
            updateCounters();
            
            // ダークモードの復元
            if (localStorage.getItem('dark_mode') === 'true') {
                document.body.classList.add('dark-mode');
            }
        });

        // 入力されるたびに自動保存＆カウンター更新
        const autoSaveAndCount = () => {
            localStorage.setItem('draft_title', titleInput.value);
            localStorage.setItem('draft_content', contentArea.value);
            updateCounters();
        };

        titleInput.addEventListener('input', autoSaveAndCount);
        contentArea.addEventListener('input', autoSaveAndCount);

        // --- 2. カウンター機能 ---
        function updateCounters() {
            const text = contentArea.value;
            charCount.textContent = text.length;
            
            if (text.length === 0) {
                lineCount.textContent = 0;
            } else {
                lineCount.textContent = text.split('\n').length;
            }
        }

        // --- 3. コピー機能 ---
        document.getElementById('btn-copy').addEventListener('click', () => {
            contentArea.select();
            navigator.clipboard.writeText(contentArea.value)
                .then(() => alert('テキストをコピーしました！'))
                .catch(err => alert('コピーに失敗しました: ' + err));
        });

        // --- 4. ダウンロード機能 (.txt) ---
        document.getElementById('btn-download').addEventListener('click', () => {
            const text = contentArea.value;
            const title = titleInput.value || 'untitled';
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `${title}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // --- 5. クリア機能 ---
        document.getElementById('btn-clear').addEventListener('click', () => {
            if (confirm('内容をすべて消去しますか？（この操作は元に戻せません）')) {
                titleInput.value = '';
                contentArea.value = '';
                localStorage.removeItem('draft_title');
                localStorage.removeItem('draft_content');
                updateCounters();
            }
        });

        // --- 6. ダークモード切替機能のバグ修正 ---
        darkModeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDarkMode = document.body.classList.contains('dark-mode');
            localStorage.setItem('dark_mode', isDarkMode);
        });
    </script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc as fsDoc, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJwQooL2MHQq2fg8aeXWGDD2s8VfzKZ04",
  authDomain: "portal-app-25359.firebaseapp.com",
  projectId: "portal-app-25359",
  storageBucket: "portal-app-25359.firebasestorage.app",
  messagingSenderId: "148295764653",
  appId: "1:148295764653:web:fe588512833f88852a9424"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const notepadCollection = collection(db, "online_notepad_history");

window.notepadHistoryCache = {};

// 履歴のロードと描画
window.loadNotepadHistory = async () => {
  const container = document.getElementById('historyList');
  if(!container) return;

  try {
    const q = query(notepadCollection, orderBy("createdAt", "desc"), limit(30));
    const snap = await getDocs(q);

    if (snap.empty) {
      container.innerHTML = '<li style="color: #9c8c8c; text-align: center; cursor: default;">履歴はありません</li>';
      return;
    }

    let html = '';
    window.notepadHistoryCache = {};

    snap.forEach(docSnap => {
      const d = docSnap.data();
      window.notepadHistoryCache[docSnap.id] = d;
      const date = d.createdAt ? d.createdAt.toDate().toLocaleString('ja-JP', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '最近';
      const title = d.title || '無題のノート';

      html += `
        <li style="display: flex; justify-content: space-between; align-items: center;" onclick="restoreNotepadHistory('${docSnap.id}')">
          <div style="flex: 1; min-width: 0;">
            <div style="font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(title)}</div>
            <div style="font-size: 11px; opacity: 0.7; margin-top: 2px;">${date}</div>
          </div>
          <button onclick="event.stopPropagation(); deleteNotepadHistory('${docSnap.id}')" style="background: none; border: none; box-shadow: none; color: #e74c3c; padding: 4px; flex-shrink: 0; font-size: 14px;" title="削除">✕</button>
        </li>
      `;
    });

    container.innerHTML = html;
  } catch (e) {
    console.error("履歴取得エラー:", e);
    container.innerHTML = '<li style="color: #e74c3c; text-align: center;">取得エラー</li>';
  }
};

// 新規履歴の保存
window.saveToFirebase = async () => {
  const title = document.getElementById('note-title').value.trim();
  const content = document.getElementById('note-content').value.trim();
  const btn = document.getElementById('btn-save');

  if (!title && !content) {
    alert("タイトルか本文を入力してください。");
    return;
  }

  const origText = btn.textContent;
  btn.textContent = "保存中...";
  btn.disabled = true;

  try {
    await addDoc(notepadCollection, {
      title: title,
      content: content,
      createdAt: serverTimestamp()
    });
    btn.textContent = "✓ 保存完了";
    window.loadNotepadHistory();
  } catch(e) {
    console.error("保存エラー:", e);
    btn.textContent = "エラー";
    alert("保存に失敗しました。");
  }

  setTimeout(() => {
    btn.textContent = origText;
    btn.disabled = false;
  }, 2000);
};

// 履歴の復元
window.restoreNotepadHistory = (id) => {
  const d = window.notepadHistoryCache[id];
  if(d) {
    const titleEl = document.getElementById('note-title');
    const contentEl = document.getElementById('note-content');
    
    titleEl.value = d.title || '';
    contentEl.value = d.content || '';
    
    // 入力イベントを発火させて、文字数カウントとローカル保存(自動保存機能)を同期させる
    titleEl.dispatchEvent(new Event('input'));
    contentEl.dispatchEvent(new Event('input'));
  }
};

// 個別削除
window.deleteNotepadHistory = async (id) => {
  if(!confirm("このノートを削除しますか？")) return;
  await deleteDoc(fsDoc(db, "online_notepad_history", id));
  window.loadNotepadHistory();
};

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 初回ロード
setTimeout(() => { window.loadNotepadHistory(); }, 500);
</script>
</body>
</html>
