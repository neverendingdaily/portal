/* ─── Ideas Parser ────────────────────────────────────────── */
const _CIRCLE='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
const _GNUMS=[..._CIRCLE];
function _bldIdea(i,label,title,body){return{index:i+1,genreNumber:_GNUMS[i]||String(i+1),genreLabel:label.slice(0,60),title:(title||label).slice(0,80),format:'instagram-carousel',sources:[],essence:'',content:body.replace(/\s+/g,' ').trim().slice(0,200),cta:''};}
function _parseSection(text,idx){
  try{
    const hm=text.match(new RegExp(`^## ([${_CIRCLE}])\\s*(.+)`,'m'));if(!hm)return null;
    const tm=text.match(/^### テーマ[：:]\s*(.+)$/m);
    const fm=text.match(/\*\*フォーマット[：:]\s*(.+?)\*\*/);
    const sm=text.match(/\*\*掛け合わせ元\*\*[：:]\s*\n([\s\S]*?)(?=\n\n\*\*|\n\*\*)/);
    const em=text.match(/\*\*切り口の核心\*\*[：:]\s*(.+)/);
    return{index:idx,genreNumber:hm[1],genreLabel:hm[2].trim(),title:tm?tm[1].trim():hm[2].trim(),
      format:(fm&&(fm[1].includes('Xスレッド')||fm[1].includes('X スレッド')))?'x-thread':'instagram-carousel',
      sources:sm?sm[1].split('\n').map(l=>l.replace(/^[-・]\s*/,'')).filter(Boolean):[],
      essence:em?em[1].trim():'',content:hm[2].trim(),cta:''};
  }catch{return null;}
}
function _parseFallback(md){
  const lines=md.split(/\r?\n/);
  const h2=lines.map((l,i)=>/^## /.test(l)?i:-1).filter(i=>i>=0);
  if(h2.length>0)return h2.slice(0,20).map((s,i)=>{
    const e=h2[i+1]||lines.length,hdr=lines[s].replace(/^##\s+/,'').replace(/^[①-⑳]\s*/,'').trim();
    const body=lines.slice(s+1,e).filter(l=>!/^#{1,6}\s/.test(l)).join(' ');
    const tm=lines.slice(s+1,e).join('\n').match(/^###\s+(?:テーマ[：:]?\s*)?(.+)$/m);
    return _bldIdea(i,hdr,tm?tm[1].trim():hdr,body);
  });
  const h1=lines.map((l,i)=>/^# [^#]/.test(l)?i:-1).filter(i=>i>=0);
  if(h1.length>1)return h1.slice(0,20).map((s,i)=>{
    const e=h1[i+1]||lines.length,t=lines[s].replace(/^#\s+/,'').trim();
    return _bldIdea(i,t,t,lines.slice(s+1,e).filter(l=>l.trim()).join(' '));
  });
  const nums=lines.map((l,i)=>/^\d+[.)]\s+\S/.test(l)?i:-1).filter(i=>i>=0);
  if(nums.length>0)return nums.slice(0,20).map((s,i)=>{
    const e=nums[i+1]||Math.min(lines.length,s+15),t=lines[s].replace(/^\d+[.)]\s+/,'').trim();
    return _bldIdea(i,t,t,lines.slice(s+1,e).filter(l=>l.trim()).join(' '));
  });
  const paras=md.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
  if(paras.length>0)return paras.slice(0,20).map((p,i)=>{
    const first=p.split('\n')[0].replace(/^[#\-*•・]\s*/,'').trim()||`アイディア ${i+1}`;
    return _bldIdea(i,first,first,p);
  });
  if(md.trim()){const first=lines.find(l=>l.trim()&&!/^---$/.test(l))?.replace(/^[#\-*•・]\s*/,'').trim()||'アイディア';return[_bldIdea(0,first,first,md)];}
  return[];
}
function parseIdeasMarkdown(md,date){
  const lines=md.split(/\r?\n/),re=new RegExp(`^## [${_CIRCLE}]`);
  const starts=lines.map((l,i)=>re.test(l)?i:-1).filter(i=>i>=0);

}

/* ─── Gemini Streaming ────────────────────────────────────── */
async function callGeminiStream(apiKey,sysPr,userPr,onChunk,onDone,onError){
  const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:streamGenerateContent?alt=sse&key=${encodeURIComponent(apiKey)}`;
  try{
    const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({system_instruction:{parts:[{text:sysPr}]},contents:[{role:'user',parts:[{text:userPr}]}],generationConfig:{temperature:0.7,maxOutputTokens:8192}})});
    if(!resp.ok){let msg=`HTTP ${resp.status}`;try{const e=await resp.json();msg=e.error?.message||msg;}catch{}onError(msg);return;}
    const reader=resp.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop()||'';
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        const d=line.slice(6).trim();if(!d)continue;
        try{const p=JSON.parse(d);const t=p?.candidates?.[0]?.content?.parts?.[0]?.text;if(t)onChunk(t);}catch{}
      }
    }
    onDone();
  }catch(err){onError(err.message);}
}

          );
        })}
        {filtered.length===0&&<div className="text-center py-10 rounded-2xl border" style={{background:'rgba(255,255,255,.6)',borderColor:'rgba(0,0,0,.08)'}}><p className="text-2xl mb-2 opacity-30">🔍</p><p className="text-sm" style={{color:'#94a3b8'}}>「{query}」に一致する機能はありません</p></div>}
      </div>
    </div>
  );
}

/* ── ManualViewer ────────────────────────────────── */
function ManualViewer({content,isGenerating}){
  const[copied,setCopied]=useState(false);
  const html=useMemo(()=>content?marked.parse(content):'',[content]);
  const copy=async()=>{await navigator.clipboard.writeText(content);setCopied(true);setTimeout(()=>setCopied(false),2000);};
  const dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/markdown'}));a.download=`canva-manual-${Date.now()}.md`;a.click();};
  if(!content&&!isGenerating)return(
    <div className="flex flex-col items-center justify-center h-40 rounded-xl border-2 border-dashed" style={{borderColor:'rgba(0,196,204,.25)',background:'rgba(255,255,255,.6)'}}>
      <span className="text-3xl mb-2 opacity-20">🎨</span>
      <p className="text-sm text-center" style={{color:'#94a3b8'}}>アイディアと機能を選択して生成ボタンを押してください</p>
    </div>
  );
  return(
    <div className="rounded-xl border overflow-hidden" style={{borderColor:'rgba(0,196,204,.2)',background:'rgba(255,255,255,.92)'}}>
      <div className="flex items-center justify-between px-4 py-2 border-b" style={{background:'rgba(0,196,204,.05)',borderColor:'rgba(0,196,204,.15)'}}>
        <span className="text-sm font-semibold flex items-center gap-2" style={{color:'#1e293b'}}>
          🎨 生成マニュアル{isGenerating&&<span className="text-xs animate-pulse" style={{color:'#5A32FA'}}>生成中...</span>}
        </span>
        {content&&<div className="flex gap-2">
          <button onClick={copy} className="text-xs px-2.5 py-1 rounded-md border" style={{background:'white',borderColor:'rgba(0,0,0,.1)',color:'#475569'}}>{copied?'✅ 済':'📋 コピー'}</button>
          <button onClick={dl} className="text-xs px-2.5 py-1 rounded-md font-bold" style={{background:'linear-gradient(135deg,#00C4CC,#5A32FA)',color:'white'}}>⬇ .md保存</button>
        </div>}
      </div>
      <div className="p-5 prose max-w-none overflow-y-auto" style={{maxHeight:'48vh'}}
        dangerouslySetInnerHTML={{__html:html+(isGenerating?'<span class="blink"></span>':'')}}/>
    </div>
  );
}

/* ── App ─────────────────────────────────────────── */
function App(){
  const[apiKey,setApiKey]=useState(()=>localStorage.getItem('gemini_api_key')||'');
  const[ideas,setIdeas]=useState([]);
  const[fileName,setFileName]=useState(null);
  const[selIdeas,setSelIdeas]=useState(new Set());
  const[selFeats,setSelFeats]=useState(new Set());
  const[manual,setManual]=useState('');
  const[isGen,setIsGen]=useState(false);
  const[error,setError]=useState(null);
  const[isDrag,setIsDrag]=useState(false);
  const fileRef=useRef(null);

  const [history, setHistory] = useState([]);

  useEffect(() => {
    if (!db) return;
    const fetchHistory = async () => {
      try {
        const snapshot = await db.collection('canva_manuals').orderBy('createdAt', 'desc').limit(20).get();
        const historyData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        setHistory(historyData);
      } catch (err) {
        console.error("履歴取得エラー:", err);
      }
    };
    fetchHistory();
  }, []);

  const readFile=useCallback(file=>{
    if(!file.name.match(/\.(md|txt)$/i)){setError('.md または .txt ファイルを選択してください');return;}
    setError(null);
    const r=new FileReader();
    r.onload=e=>{const p=parseIdeasMarkdown(e.target.result,file.name.replace(/\.[^.]+$/,''));setIdeas(p.ideas);setFileName(file.name);setSelIdeas(new Set());setManual('');};
    r.onerror=()=>setError('ファイルの読み込みに失敗しました');
    r.readAsText(file,'utf-8');
  },[]);

  const toggleIdea=useCallback(idx=>setSelIdeas(p=>{const n=new Set(p);n.has(idx)?n.delete(idx):n.add(idx);return n;}),[]);
  const toggleFeat=useCallback(id=>setSelFeats(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n;}),[]);
  const autoSuggest=useCallback(()=>{if(!ideas.length)return;const s=suggestFeatureIds(ideas);setSelFeats(p=>new Set([...p,...s]));},[ideas]);

  const generate=async()=>{
    if(!apiKey){setError('Gemini APIキーを入力して「保存」してください');return;}
    const sIdeas=ideas.filter(i=>selIdeas.has(i.index));
    const sFeats=CANVA_FEATURES.filter(f=>selFeats.has(f.id));
    if(!sIdeas.length||!sFeats.length){setError('アイディアとCanva機能を1件以上選択してください');return;}
    setIsGen(true);setManual('');setError(null);
    
    let generatedContent = '';
    
    callGeminiStream(apiKey,SYSTEM_PROMPT,buildUserPrompt(sIdeas,sFeats),
      chunk => {
        setManual(p=>p+chunk);
        generatedContent += chunk;
      },
      async () => {
        setIsGen(false);
        if(db) {
          try {
            const docRef = await db.collection('canva_manuals').add({
              content: generatedContent,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              ideaCount: sIdeas.length,
              featureCount: sFeats.length
            });
            setHistory(prev => [{
              id: docRef.id,
              content: generatedContent,
              createdAt: new Date(),
              ideaCount: sIdeas.length,
              featureCount: sFeats.length
            }, ...prev]);
          } catch(err) {
            console.error("履歴保存エラー:", err);
          }
        }
      },
      msg=>{setError(`APIエラー: ${msg}`);setIsGen(false);}
    );
  };

  const canGen=selIdeas.size>0&&selFeats.size>0&&!isGen;

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden'}}>

      {/* Header */}
      <header style={{background:'rgba(255,255,255,.88)',backdropFilter:'blur(12px)',borderBottom:'1px solid rgba(0,196,204,.15)',boxShadow:'0 2px 12px rgba(90,50,250,.06)',flexShrink:0}}>
        <div className="flex items-center justify-between gap-4 px-5 py-3">
          <div className="flex items-center gap-3 shrink-0">
            <div className="w-8 h-8 rounded-lg flex items-center justify-center font-black text-sm" style={{background:'linear-gradient(135deg,#00C4CC,#5A32FA)',color:'white'}}>C</div>
            <div className="hidden sm:block">
              <p className="text-sm font-black leading-tight" style={{color:'#0f172a'}}>Canva Pro</p>
              <p className="text-[10px] leading-tight" style={{color:'#00C4CC'}}>マニュアル生成ポータル</p>
            </div>
          </div>
          <p className="text-xs flex-1 text-center hidden md:block" style={{color:'#64748b'}}>SNSアイディアファイルを読み込み、Canva機能を選択してデザインマニュアルを自動生成</p>
          <ApiKeyBar apiKey={apiKey} onChange={setApiKey}/>
        </div>
      </header>

      {/* Error */}
      {error&&<div className="mx-4 mt-2 px-4 py-2 rounded-xl text-sm flex items-center gap-2 border" style={{background:'rgba(248,113,113,.08)',borderColor:'rgba(248,113,113,.25)',color:'#dc2626',flexShrink:0}}>⚠️ {error}<button onClick={()=>setError(null)} className="ml-auto text-xs opacity-60">✕</button></div>}

      {/* Body */}
      <div style={{flex:1,display:'flex',overflow:'hidden'}}>

        {/* Left pane */}
        <div style={{width:285,flexShrink:0,display:'flex',flexDirection:'column',overflow:'hidden',background:'rgba(255,255,255,.72)',backdropFilter:'blur(8px)',borderRight:'1px solid rgba(0,196,204,.15)'}}>
          {/* Upload */}
          <div className="p-4 border-b" style={{borderColor:'rgba(0,0,0,.06)',flexShrink:0}}>
            <p className="text-[11px] font-bold uppercase tracking-widest mb-2" style={{color:'#94a3b8'}}>📂 アイディアファイル</p>
            {fileName?(
              <div className="rounded-xl border p-3" style={{borderColor:'rgba(0,196,204,.3)',background:'rgba(0,196,204,.05)'}}>
                <div className="flex items-center gap-2.5">
                  <span className="w-8 h-8 rounded-lg flex items-center justify-center" style={{background:'rgba(0,196,204,.12)'}}>📄</span>
                  <div className="flex-1 min-w-0">
                    <p className="text-xs font-semibold truncate" style={{color:'#1e293b'}}>{fileName}</p>
                    <p className="text-xs" style={{color:ideas.length>0?'#00a8ae':'#dc2626'}}>{ideas.length>0?`${ideas.length}件のアイディアを読み込み`:'アイディアが見つかりませんでした'}</p>
                  </div>
                  <button onClick={()=>{setIdeas([]);setFileName(null);setSelIdeas(new Set());setManual('');}} className="text-xs px-2 py-1 rounded-md" style={{color:'#94a3b8'}}>変更</button>
                </div>
              </div>
            ):(
              <div onDrop={e=>{e.preventDefault();setIsDrag(false);const f=e.dataTransfer.files[0];if(f)readFile(f);}}
                onDragOver={e=>{e.preventDefault();setIsDrag(true);}} onDragLeave={()=>setIsDrag(false)}
                onClick={()=>fileRef.current?.click()}
                className="rounded-xl border-2 border-dashed p-4 text-center cursor-pointer transition-all"
                style={{borderColor:isDrag?'#00C4CC':'rgba(0,196,204,.35)',background:isDrag?'rgba(0,196,204,.06)':'rgba(255,255,255,.6)'}}>
                <div className="flex items-center justify-center gap-3">
                  <span className="text-xl">📂</span>
                  <div className="text-left">
                    <p className="text-sm font-semibold" style={{color:'#1e293b'}}>ドラッグ＆ドロップ</p>
                    <p className="text-xs" style={{color:'#94a3b8'}}>または<span style={{color:'#00C4CC'}}>クリックして選択</span>（.md/.txt）</p>
                  </div>
                </div>
              </div>
            )}
            <input ref={fileRef} type="file" accept=".md,.txt" className="hidden" onChange={e=>{const f=e.target.files?.[0];if(f)readFile(f);e.target.value='';}}/>
          </div>

          {/* Idea list */}
          <div style={{flex:1,overflowY:'auto',padding:'1rem'}}>
            {ideas.length===0?(
              <div className="flex flex-col items-center justify-center py-10 gap-2"><span className="text-3xl opacity-20">💡</span><p className="text-xs text-center" style={{color:'#94a3b8'}}>ファイルをアップロードしてください</p></div>
            ):(
              <>
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-2"><span className="text-sm font-bold" style={{color:'#475569'}}>アイディア一覧</span><span className="canva-badge">{ideas.length}件</span></div>
                  <div className="flex gap-2">
                    <button onClick={()=>setSelIdeas(new Set(ideas.map(i=>i.index)))} className="text-xs" style={{color:'#00C4CC'}}>全選択</button>
                    <span style={{color:'#cbd5e1'}}>|</span>
                    <button onClick={()=>setSelIdeas(new Set())} className="text-xs" style={{color:'#94a3b8'}}>解除</button>
                  </div>
                </div>
                <div className="space-y-2">{ideas.map(idea=><IdeaCard key={idea.index} idea={idea} selected={selIdeas.has(idea.index)} onToggle={toggleIdea}/>)}</div>
                {selIdeas.size>0&&<p className="text-xs text-center mt-2 font-medium" style={{color:'#00C4CC'}}>{selIdeas.size}件選択中</p>}
              </>
            )}
          </div>

          {/* Auto suggest */}
          {ideas.length>0&&(
            <div className="p-3 border-t" style={{borderColor:'rgba(0,0,0,.06)',flexShrink:0}}>
              <button onClick={autoSuggest} className="w-full canva-btn text-xs font-bold py-2.5 px-3 rounded-xl flex items-center justify-center gap-1.5">
                ✨ アイディアからおすすめのCanva機能を自動選択
              </button>
            </div>
          )}

          {/* History */}
          <div className="p-3 border-t overflow-y-auto" style={{borderColor:'rgba(0,0,0,.06)', maxHeight: '35vh', flexShrink: 0}}>
            <p className="text-[11px] font-bold uppercase tracking-widest mb-2" style={{color:'#94a3b8'}}>🕒 履歴（過去の生成）</p>
            {history.length === 0 ? (
              <p className="text-xs text-center py-2" style={{color:'#94a3b8'}}>履歴はありません</p>
            ) : (
              <div className="space-y-2">
                {history.map(item => (
                  <div key={item.id} className="p-2 border rounded-xl cursor-pointer text-xs transition-all"
                    style={{background:'rgba(255,255,255,0.7)', borderColor:'rgba(0,0,0,.08)'}}
                    onClick={() => { setManual(item.content); setSelIdeas(new Set()); setSelFeats(new Set()); }}
                  >
                    <p className="font-bold text-[#1e293b] truncate">生成マニュアル</p>
                    <p className="text-[#94a3b8]" style={{fontSize: '10px'}}>
                      💡{item.ideaCount}機能 × 🎨{item.featureCount}機能
                      <br/>
                      {item.createdAt && item.createdAt.toDate
                        ? item.createdAt.toDate().toLocaleString()
                        : new Date(item.createdAt || Date.now()).toLocaleString()}
                    </p>
                  </div>
                ))}
              </div>
            )}
          </div>

        </div>

        {/* Right pane */}
        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}}>
          {/* Feature area */}
          <div style={{overflowY:'auto',padding:'1.25rem',borderBottom:'1px solid rgba(0,196,204,.12)',maxHeight:'60%'}}>
            <FeatureSelector selectedIds={selFeats} onToggle={toggleFeat}
              onSelectAll={()=>setSelFeats(new Set(CANVA_FEATURES.map(f=>f.id)))}
              onClearAll={()=>setSelFeats(new Set())}/>
            {/* Generate button */}
            <div className="flex flex-col items-center gap-2.5 py-5">
              {(selIdeas.size>0||selFeats.size>0)&&(
                <div className="flex items-center gap-2">
                  <span className="canva-badge">{selIdeas.size} アイディア</span>
                  <span style={{color:'#cbd5e1'}}>×</span>
                  <span className="canva-badge">{selFeats.size} 機能</span>
                </div>
              )}
              <button onClick={generate} disabled={!canGen} className="canva-btn flex items-center gap-2.5 px-10 py-3.5 rounded-full text-base shadow-lg">
                {isGen?(
                  <><svg className="spin" style={{width:'1.25rem',height:'1.25rem'}} viewBox="0 0 24 24" fill="none"><circle style={{opacity:.25}} cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path style={{opacity:.75}} fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>マニュアル生成中...</>
                ):'🎨 Canvaマニュアルを生成する'}
              </button>
              {!canGen&&!isGen&&<p className="text-xs" style={{color:'#94a3b8'}}>{selIdeas.size===0?'アイディアを選択してください':'Canva機能を選択してください'}</p>}
            </div>
          </div>
          {/* Output area */}
          <div style={{flex:1,overflowY:'auto',padding:'1.25rem',background:'rgba(255,255,255,.40)'}}>
            <ManualViewer content={manual} isGenerating={isGen}/>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
